/* ---------------------------------------------------------
   FIREBASE — couche de stockage
   'profile' reste local à l'appareil (localStorage).
   Tout le reste est partagé en temps réel via Firestore
   (collection 'app', un document par clé).
--------------------------------------------------------- */
let db = null, authReady = null;
function initFirebase() {
  if (firebase.apps.length) return;
  firebase.initializeApp(window.__FIREBASE_CONFIG__);
  db = firebase.firestore();
  authReady = new Promise((resolve) => {
    firebase.auth().onAuthStateChanged((u) => {
      if (u) resolve(u);
      else firebase.auth().signInAnonymously().catch(() => resolve(null));
    });
  });
}

async function cloudGet(key) {
  await authReady;
  try {
    const snap = await db.collection("app").doc(key).get();
    return snap.exists ? snap.data().value : null;
  } catch (e) { return null; }
}
async function cloudSet(key, value) {
  await authReady;
  try {
    await db.collection("app").doc(key).set({ value, updatedAt: Date.now() });
    return true;
  } catch (e) { return false; }
}
function cloudListen(key, cb) {
  db.collection("app").doc(key).onSnapshot(
    (snap) => cb(snap.exists ? snap.data().value : null),
    () => {}
  );
}
function localGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function localSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

function compressImage(file, maxW = 700, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   APP
========================================================= */
function App() {
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [team, setTeam] = useState([]);
  const [properties, setProperties] = useState([]);
  const [cleanings, setCleanings] = useState([]);
  const [reservations, setReservations] = useState([]);
  const [tab, setTab] = useState("planning");
  const [error, setError] = useState("");
  const [offline, setOffline] = useState(false);

  useEffect(() => {
    try {
      initFirebase();
    } catch (e) {
      setError("Configuration Firebase manquante ou invalide — voir README.md.");
      setLoading(false);
      return;
    }
    const p = localGet("profile");
    if (p) { try { setProfile(JSON.parse(p)); } catch (e) {} }

    let received = 0;
    const mark = () => { received++; if (received >= 4) setLoading(false); };
    cloudListen("team", (v) => { setTeam(v ? JSON.parse(v) : []); mark(); });
    cloudListen("properties", (v) => { setProperties(v ? JSON.parse(v) : []); mark(); });
    cloudListen("cleanings", (v) => { setCleanings(v ? JSON.parse(v) : []); mark(); });
    cloudListen("reservations", (v) => { setReservations(v ? JSON.parse(v) : []); mark(); });

    const timeout = setTimeout(() => setLoading(false), 6000);
    window.addEventListener("offline", () => setOffline(true));
    window.addEventListener("online", () => setOffline(false));
    return () => clearTimeout(timeout);
  }, []);

  const saveTeam = useCallback(async (next) => {
    setTeam(next);
    const ok = await cloudSet("team", JSON.stringify(next));
    if (!ok) setError("Sauvegarde de l'équipe impossible. Vérifie ta connexion.");
  }, []);
  const saveProperties = useCallback(async (next) => {
    setProperties(next);
    const ok = await cloudSet("properties", JSON.stringify(next));
    if (!ok) setError("Sauvegarde des logements impossible. Vérifie ta connexion.");
  }, []);
  const saveCleanings = useCallback(async (next) => {
    setCleanings(next);
    const ok = await cloudSet("cleanings", JSON.stringify(next));
    if (!ok) setError("Sauvegarde du planning impossible. Vérifie ta connexion.");
  }, []);
  const saveReservations = useCallback(async (next) => {
    setReservations(next);
    const ok = await cloudSet("reservations", JSON.stringify(next));
    if (!ok) setError("Sauvegarde des réservations impossible. Vérifie ta connexion.");
  }, []);

  const completeOnboarding = async (name, role) => {
    const id = uid();
    const p = { id, name, role };
    setProfile(p);
    localSet("profile", JSON.stringify(p));
    await saveTeam([...team, { id, name, role }]);
  };
  const switchProfile = () => { localSet("profile", ""); setProfile(null); };

  if (loading) {
    return (
      <div style={{ background: C.linen }} className="min-h-screen flex items-center justify-center">
        <div className="animate-spin"><Icon name="loader" size={28} color={C.terracotta} /></div>
      </div>
    );
  }

  if (error && !profile) {
    return (
      <div style={{ background: C.ink }} className="min-h-screen flex items-center justify-center px-6 text-center">
        <div>
          <Icon name="alert" size={28} color={C.terracotta} />
          <p style={{ color: C.linen }} className="mt-3 text-sm">{error}</p>
        </div>
      </div>
    );
  }

  if (!profile) return <Onboarding onDone={completeOnboarding} />;

  return (
    <div style={{ background: C.linen, fontFamily: "'Inter', sans-serif" }} className="min-h-screen flex flex-col">
      <Header profile={profile} onSwitch={switchProfile} offline={offline} />
      {error && (
        <div className="mx-4 mt-3 rounded-lg px-3 py-2 text-sm flex items-center gap-2" style={{ background: "#F3DCCF", color: C.terracotta }}>
          <Icon name="alert" size={16} /><span className="flex-1">{error}</span>
          <button onClick={() => setError("")}><Icon name="x" size={14} /></button>
        </div>
      )}
      <main className="flex-1 overflow-y-auto pb-24 px-4">
        {tab === "planning" && (
          <PlanningTab profile={profile} team={team} properties={properties} cleanings={cleanings} saveCleanings={saveCleanings} />
        )}
        {tab === "occupation" && (
          <OccupationTab profile={profile} properties={properties} reservations={reservations} saveReservations={saveReservations} />
        )}
        {tab === "proprietes" && (
          <ProprietesTab profile={profile} properties={properties} saveProperties={saveProperties} cleanings={cleanings} />
        )}
        {tab === "equipe" && <EquipeTab team={team} profile={profile} />}
      </main>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

/* =========================================================
   ONBOARDING
========================================================= */
function Onboarding({ onDone }) {
  const [name, setName] = useState("");
  const [role, setRole] = useState("owner");
  const [saving, setSaving] = useState(false);
  const submit = async () => {
    if (!name.trim()) return;
    setSaving(true);
    await onDone(name.trim(), role);
    setSaving(false);
  };
  return (
    <div style={{ background: C.ink, fontFamily: "'Inter', sans-serif" }} className="min-h-screen flex flex-col items-center justify-center px-6">
      <div className="w-full max-w-sm">
        <div className="mb-8 text-center">
          <div className="mx-auto mb-4 flex items-center justify-center rounded-2xl" style={{ width: 56, height: 56, background: C.terracotta }}>
            <Icon name="barChart" size={26} color={C.linen} />
          </div>
          <h1 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.linen }} className="text-2xl font-semibold">Planning Ménage</h1>
          <p style={{ color: C.taupeLight }} className="text-sm mt-1">Planning, réservations et taux de remplissage, partagés en temps réel.</p>
        </div>
        <label style={{ color: C.taupeLight }} className="text-xs uppercase tracking-wide font-medium">Ton prénom</label>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex. Camille"
          className="w-full mt-2 mb-5 px-4 py-3 rounded-xl outline-none text-base" style={{ background: C.linen, color: C.ink }} />
        <label style={{ color: C.taupeLight }} className="text-xs uppercase tracking-wide font-medium">Ton rôle</label>
        <div className="grid grid-cols-2 gap-3 mt-2 mb-6">
          <button onClick={() => setRole("owner")} className="rounded-xl py-3 text-sm font-medium border transition"
            style={{ background: role === "owner" ? C.terracotta : "transparent", color: role === "owner" ? C.linen : C.taupeLight, borderColor: role === "owner" ? C.terracotta : C.taupe }}>
            Propriétaire
          </button>
          <button onClick={() => setRole("cleaner")} className="rounded-xl py-3 text-sm font-medium border transition"
            style={{ background: role === "cleaner" ? C.sauge : "transparent", color: role === "cleaner" ? C.linen : C.taupeLight, borderColor: role === "cleaner" ? C.sauge : C.taupe }}>
            Équipe de ménage
          </button>
        </div>
        <button onClick={submit} disabled={!name.trim() || saving}
          className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 disabled:opacity-50" style={{ background: C.linen, color: C.ink }}>
          {saving ? <div className="animate-spin"><Icon name="loader" size={18} /></div> : "Rejoindre le planning"}
        </button>
        <p style={{ color: C.taupe }} className="text-xs text-center mt-4">Les données sont partagées entre tous les membres de l'équipe.</p>
      </div>
    </div>
  );
}

        <p style={{ color: C.taupe }} className="text-xs uppercase tracking-wide">

function TabBar({ tab, setTab }) {
  const items = [
    { id: "planning", label: "Ménage", icon: "calendar" },
    { id: "occupation", label: "Réservations", icon: "barChart" },
    { id: "proprietes", label: "Logements", icon: "home" },
    { id: "equipe", label: "Équipe", icon: "users" },
  ];
  return (
    <nav className="fixed bottom-0 left-0 right-0 flex justify-around items-center py-2 border-t" style={{ background: C.linen, borderColor: C.taupeLight, paddingBottom: "calc(env(safe-area-inset-bottom) + 6px)" }}>
      {items.map(({ id, label, icon }) => {
        const active = tab === id;
        return (
          <button key={id} onClick={() => setTab(id)} className="flex flex-col items-center gap-1 px-3 py-1.5 rounded-xl transition" style={{ color: active ? C.terracotta : C.taupe }}>
            <Icon name={icon} size={20} strokeWidth={active ? 2.4 : 1.8} />
            <span className="text-[10.5px] font-medium">{label}</span>
          </button>

      })}

/* =========================================================
   PLANNING (ménage) TAB — inchangé dans l'esprit
========================================================= */
function PlanningTab({ profile, team, properties, cleanings, saveCleanings }) {
  const [filter, setFilter] = useState("upcoming");
  const [showForm, setShowForm] = useState(false);
  const [openId, setOpenId] = useState(null);

  const visible = useMemo(() => {
    let list = cleanings;
    if (profile.role === "cleaner") list = list.filter((c) => c.assignedToId === profile.id);
    const today = todayISO();
    if (filter === "today") list = list.filter((c) => c.date === today);
    else if (filter === "upcoming") list = list.filter((c) => c.date >= today);
    else if (filter === "history") list = list.filter((c) => c.date < today || c.status === "termine");
    return [...list].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  }, [cleanings, profile, filter]);

  const todayPending = cleanings.filter((c) => c.date === todayISO() && c.status !== "termine" && (profile.role === "owner" || c.assignedToId === profile.id));
  const propertyOf = (id) => properties.find((p) => p.id === id);
  const personOf = (id) => team.find((t) => t.id === id);
  const openCleaning = openId ? cleanings.find((c) => c.id === openId) : null;

  return (
    <div>
      {todayPending.length > 0 && (
        <div className="rounded-xl px-4 py-3 mb-4 flex items-center gap-3" style={{ background: "#F3DCCF" }}>
          <Icon name="alert" size={18} color={C.terracotta} />
          <p style={{ color: C.terracotta }} className="text-sm font-medium">{todayPending.length} ménage{todayPending.length > 1 ? "s" : ""} à faire aujourd'hui</p>
        </div>
      )}
      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-2">
          {[["upcoming", "À venir"], ["today", "Aujourd'hui"], ["history", "Historique"]].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)} className="text-xs font-medium px-3 py-1.5 rounded-full"
              style={{ background: filter === id ? C.ink : C.linenSoft, color: filter === id ? C.linen : C.taupe }}>{label}</button>
          ))}
        </div>
        {profile.role === "owner" && (
          <button onClick={() => setShowForm(true)} className="rounded-full p-2" style={{ background: C.ink }}>
            <Icon name="plus" size={18} color={C.linen} />
          </button>
        )}
      </div>
      {visible.length === 0 && (
        <EmptyState icon="calendar" text={profile.role === "owner" ? "Aucun ménage ici. Ajoute-en un avec le bouton +." : "Aucun ménage ne t'est assigné pour l'instant."} />
      )}
      <div className="flex flex-col gap-3">
        {visible.map((c) => (
          <DoorTagCard key={c.id} cleaning={c} property={propertyOf(c.propertyId)} person={personOf(c.assignedToId)} onClick={() => setOpenId(c.id)} />
        ))}
      </div>
      {showForm && (
        <NewCleaningForm properties={properties} team={team} onClose={() => setShowForm(false)}
          onCreate={async (data) => { await saveCleanings([...cleanings, { id: uid(), status: "a_faire", checklistDone: {}, ...data }]); setShowForm(false); }} />
      )}
      {openCleaning && (
        <CleaningDetail cleaning={openCleaning} property={propertyOf(openCleaning.propertyId)} person={personOf(openCleaning.assignedToId)} profile={profile}
          onClose={() => setOpenId(null)}
          onUpdate={async (patch) => { await saveCleanings(cleanings.map((c) => (c.id === openCleaning.id ? { ...c, ...patch } : c))); }}
          onDelete={async () => { await saveCleanings(cleanings.filter((c) => c.id !== openCleaning.id)); setOpenId(null); }} />
      )}
    </div>
  );
}

function DoorTagCard({ cleaning, property, person, onClick }) {
  const s = STATUS[cleaning.status] || STATUS.a_faire;
  const total = property?.checklist?.length || 0;
  const done = Object.values(cleaning.checklistDone || {}).filter(Boolean).length;
  return (
    <button onClick={onClick} className="relative w-full text-left rounded-2xl overflow-hidden border" style={{ borderColor: C.taupeLight, background: "#FFFDF8" }}>
      <div className="absolute -top-2 left-6 w-4 h-4 rounded-full" style={{ background: C.linen, border: `1px solid ${C.taupeLight}` }} />
      <div className="flex">
        <div className="w-1.5" style={{ background: s.color }} />
        <div className="flex-1 px-4 py-3">
          <div className="flex items-center justify-between">
            <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="font-semibold text-[15px]">{property?.name || "Logement supprimé"}</h3>
            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{ background: s.bg, color: s.color }}>{s.label}</span>
          </div>
          <div style={{ color: C.taupe }} className="flex items-center gap-3 text-xs mt-1.5">
            <span className="flex items-center gap-1"><Icon name="calendar" size={12} /> {fmtDate(cleaning.date)}</span>
            <span className="flex items-center gap-1"><Icon name="clock" size={12} /> {cleaning.time}</span>
          </div>
          <div style={{ color: C.taupe }} className="flex items-center justify-between text-xs mt-2">
            <span className="flex items-center gap-1"><Icon name="user" size={12} /> {person?.name || "Non assigné"}</span>
            {total > 0 && <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{done}/{total}</span>}
          </div>
        </div>
        <div className="flex items-center pr-3"><Icon name="chevronRight" size={18} color={C.taupe} /></div>
      </div>
    </button>
  );
}

function CleaningDetail({ cleaning, property, person, profile, onClose, onUpdate, onDelete }) {
  const [photos, setPhotos] = useState([]);
  const [loadingPhotos, setLoadingPhotos] = useState(true);
  const [uploading, setUploading] = useState(false);
  const [notes, setNotes] = useState(cleaning.notes || "");

  useEffect(() => {
    (async () => {
      const raw = await cloudGet(`photos:${cleaning.id}`);
      setPhotos(raw ? JSON.parse(raw) : []);
      setLoadingPhotos(false);
    })();
  }, [cleaning.id]);

  const checklist = property?.checklist || [];
  const doneMap = cleaning.checklistDone || {};
  const doneCount = checklist.filter((it) => doneMap[it.id]).length;
  const toggleItem = (itemId) => onUpdate({ checklistDone: { ...doneMap, [itemId]: !doneMap[itemId] } });
  const setStatus = (status) => onUpdate({ status });

  const handlePhoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    try {
      const dataUrl = await compressImage(file);
      const next = [...photos, dataUrl];
      setPhotos(next);
      await cloudSet(`photos:${cleaning.id}`, JSON.stringify(next));
    } catch (err) {}
    setUploading(false);
    e.target.value = "";
  };
  const removePhoto = async (idx) => {
    const next = photos.filter((_, i) => i !== idx);
    setPhotos(next);
    await cloudSet(`photos:${cleaning.id}`, JSON.stringify(next));
  };
  const saveNotes = () => onUpdate({ notes });

  return (
    <Sheet onClose={onClose} title={property?.name || "Ménage"}>
      <div style={{ color: C.taupe }} className="flex items-center gap-3 text-sm mb-4">
        <span className="flex items-center gap-1"><Icon name="calendar" size={14} />{fmtDate(cleaning.date)}</span>
        <span className="flex items-center gap-1"><Icon name="clock" size={14} />{cleaning.time}</span>
      </div>
      {property?.address && <p style={{ color: C.taupe }} className="flex items-center gap-1 text-sm mb-4"><Icon name="mapPin" size={14} /> {property.address}</p>}
      <div className="flex gap-2 mb-5">
        {Object.entries(STATUS).map(([key, s]) => (
          <button key={key} onClick={() => setStatus(key)} className="flex-1 py-2 rounded-lg text-xs font-semibold border"
            style={{ background: cleaning.status === key ? s.color : "transparent", color: cleaning.status === key ? "#fff" : s.color, borderColor: s.color }}>{s.label}</button>
        ))}
      </div>
      <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Checklist ({doneCount}/{checklist.length})</p>
      <div className="flex flex-col gap-2 mb-5">
        {checklist.length === 0 && <p style={{ color: C.taupe }} className="text-sm">Ce logement n'a pas encore de checklist.</p>}
        {checklist.map((item) => {
          const checked = !!doneMap[item.id];
          return (
            <button key={item.id} onClick={() => toggleItem(item.id)} className="flex items-center gap-3 text-left px-3 py-2.5 rounded-xl" style={{ background: checked ? "#DDE7DF" : C.linenSoft }}>
              <span className="flex items-center justify-center rounded-md shrink-0" style={{ width: 20, height: 20, background: checked ? C.sauge : "#fff", border: `1px solid ${checked ? C.sauge : C.taupeLight}` }}>
                {checked && <Icon name="check" size={13} color="#fff" />}
              </span>
              <span style={{ color: C.ink, textDecoration: checked ? "line-through" : "none" }} className="text-sm">{item.text}</span>
            </button>
          );
        })}
      </div>
      <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Photos</p>
      <div className="flex flex-wrap gap-2 mb-2">
        {loadingPhotos ? <div className="animate-spin"><Icon name="loader" size={18} color={C.taupe} /></div> : photos.map((src, i) => (
          <div key={i} className="relative">
            <img src={src} alt="" className="w-20 h-20 object-cover rounded-lg" />
            <button onClick={() => removePhoto(i)} className="absolute -top-1.5 -right-1.5 rounded-full p-0.5" style={{ background: C.ink }}><Icon name="x" size={11} color="#fff" /></button>
          </div>
        ))}
        <label className="w-20 h-20 rounded-lg flex items-center justify-center border-2 border-dashed cursor-pointer" style={{ borderColor: C.taupeLight }}>
          {uploading ? <div className="animate-spin"><Icon name="loader" size={18} color={C.taupe} /></div> : <Icon name="camera" size={18} color={C.taupe} />}
          <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhoto} />
        </label>
      </div>
      <p style={{ color: C.taupe }} className="text-xs mb-5">Les photos sont visibles par toute l'équipe.</p>
      <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Notes</p>
      <textarea value={notes} onChange={(e) => setNotes(e.target.value)} onBlur={saveNotes} placeholder="Ex. clé sous le pot, interphone en panne…" rows={3}
        className="w-full px-3 py-2 rounded-xl text-sm outline-none mb-5" style={{ background: C.linenSoft, color: C.ink }} />
      {profile.role === "owner" && (
        <button onClick={onDelete} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm" style={{ background: "#F3DCCF", color: C.terracotta }}>
          <Icon name="trash" size={15} /> Supprimer ce ménage
        </button>
      )}
    </Sheet>
  );
}

/* =========================================================
   OCCUPATION TAB — Gantt des réservations + taux de remplissage
========================================================= */
const DAY_W = 30;
const LABEL_W = 108;

function OccupationTab({ profile, properties, reservations, saveReservations }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [showForm, setShowForm] = useState(false);
  const [openId, setOpenId] = useState(null);

  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const nDays = daysInMonth(year, month);
  const monthLabel = base.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const monthStartISO = isoOf(year, month, 1);
  const monthEndISO = isoOf(year, month, nDays); // last day, inclusive date
  const todayIdx = (now.getFullYear() === year && now.getMonth() === month) ? now.getDate() : null;

  const dayCols = Array.from({ length: nDays }, (_, i) => i + 1);

  // nights overlap helper (checkOut exclusive)
  const nextMonthStartISO = isoOf(year, month + 1, 1);
  const nightsInMonth = (res) => {
    const ci = res.checkIn, co = res.checkOut;
    if (co <= monthStartISO || ci >= nextMonthStartISO) return 0;
    const start = ci < monthStartISO ? monthStartISO : ci;
    const end = co > nextMonthStartISO ? nextMonthStartISO : co;
    return Math.max(0, Math.round((new Date(end) - new Date(start)) / 86400000));
  };

  const occupancy = useMemo(() => {
    return properties.map((p) => {
      const nights = reservations.filter((r) => r.propertyId === p.id).reduce((sum, r) => sum + nightsInMonth(r), 0);
      const pct = Math.round((Math.min(nights, nDays) / nDays) * 100);
      return { property: p, nights, pct };
    });
  }, [properties, reservations, year, month]);

  const avgPct = occupancy.length ? Math.round(occupancy.reduce((s, o) => s + o.pct, 0) / occupancy.length) : 0;

  const pctColor = (pct) => (pct < 40 ? C.terracotta : pct < 70 ? C.or : C.sauge);

  const dayIndexClamped = (iso) => {
    const d = new Date(iso);
    const idx = Math.round((d - new Date(year, month, 1)) / 86400000) + 1;
    return Math.max(1, Math.min(nDays + 1, idx));
  };

  const openReservation = openId ? reservations.find((r) => r.id === openId) : null;

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold">Réservations</h2>
        {profile.role === "owner" && (
          <button onClick={() => setShowForm(true)} className="rounded-full p-2" style={{ background: C.ink }}>
            <Icon name="plus" size={18} color={C.linen} />
          </button>
        )}
      </div>

      {/* Résumé taux de remplissage */}
      {properties.length > 0 && (
        <div className="mb-4">
          <div className="flex items-center justify-between mb-2">
            <p style={{ color: C.ink }} className="text-sm font-semibold">Taux de remplissage — {monthLabel}</p>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: pctColor(avgPct) }} className="text-sm font-semibold">{avgPct}% moy.</span>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1">
            {occupancy.map(({ property, pct, nights }) => (
              <div key={property.id} className="shrink-0 rounded-xl px-3 py-2 min-w-[110px]" style={{ background: "#FFFDF8", border: `1px solid ${C.taupeLight}` }}>
                <p style={{ color: C.ink }} className="text-xs font-medium truncate">{property.name}</p>
                <div className="flex items-center gap-1.5 mt-1">
                  <div className="flex-1 h-1.5 rounded-full" style={{ background: C.linenSoft }}>
                    <div className="h-1.5 rounded-full" style={{ width: `${pct}%`, background: pctColor(pct) }} />
                  </div>
                  <span style={{ color: pctColor(pct), fontFamily: "'IBM Plex Mono', monospace" }} className="text-[11px] font-semibold">{pct}%</span>
                </div>
                <p style={{ color: C.taupe }} className="text-[10px] mt-1">{nights} nuits réservées</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Nav mois */}
      <div className="flex items-center justify-between mb-3">
        <button onClick={() => setMonthOffset((m) => m - 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronLeft" size={16} color={C.taupe} /></button>
        <p style={{ color: C.ink, fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold capitalize">{monthLabel}</p>
        <button onClick={() => setMonthOffset((m) => m + 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronRight" size={16} color={C.taupe} /></button>
      </div>

      {properties.length === 0 ? (
        <EmptyState icon="home" text="Ajoute un logement pour voir son planning de réservations." />
      ) : (
        <div className="rounded-2xl overflow-hidden border mb-6" style={{ borderColor: C.taupeLight, background: "#FFFDF8" }}>
          <div className="overflow-x-auto">
            <div style={{ width: LABEL_W + nDays * DAY_W }}>
              {/* header jours */}
              <div className="flex sticky top-0 z-10" style={{ background: "#FFFDF8" }}>
                <div style={{ width: LABEL_W }} className="shrink-0 border-b" style={{ borderColor: C.taupeLight }} />
                {dayCols.map((d) => (
                  <div key={d} style={{ width: DAY_W, background: d === todayIdx ? "#F3DCCF" : "transparent" }}
                    className="shrink-0 text-center py-1.5 border-b text-[10px]" >
                    <span style={{ color: d === todayIdx ? C.terracotta : C.taupe, fontFamily: "'IBM Plex Mono', monospace" }}>{d}</span>
                  </div>
                ))}
              </div>
              {/* lignes logements */}
              {properties.map((p) => {
                const resForP = reservations.filter((r) => r.propertyId === p.id && r.checkOut > monthStartISO && r.checkIn <= monthEndISO);
                return (
                  <div key={p.id} className="flex border-b" style={{ borderColor: C.taupeLight }}>
                    <div style={{ width: LABEL_W, position: "sticky", left: 0, background: "#FFFDF8" }} className="shrink-0 px-2.5 py-3 flex items-center z-10">
                      <span style={{ color: C.ink }} className="text-xs font-medium truncate">{p.name}</span>
                    </div>
                    <div style={{ width: nDays * DAY_W, position: "relative", minHeight: 44 }}>
                      {resForP.map((r) => {
                        const startCol = dayIndexClamped(r.checkIn < monthStartISO ? monthStartISO : r.checkIn);
                        const endCol = dayIndexClamped(r.checkOut > isoOf(year, month + 1, 1) ? isoOf(year, month + 1, 1) : r.checkOut);
                        const src = SOURCES[r.source] || SOURCES.autre;
                        return (
                          <button key={r.id} onClick={() => setOpenId(r.id)}
                            className="absolute top-2 rounded-md text-left px-1.5 flex items-center overflow-hidden"
                            style={{ left: (startCol - 1) * DAY_W + 2, width: Math.max(DAY_W - 4, (endCol - startCol) * DAY_W - 4), height: 26, background: src.color }}>
                            <span className="text-[10px] font-medium truncate" style={{ color: "#fff" }}>{r.guestName}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="flex gap-3 px-3 py-2.5 flex-wrap">
            {Object.entries(SOURCES).map(([k, s]) => (
              <span key={k} className="flex items-center gap-1.5 text-[11px]" style={{ color: C.taupe }}>
                <span style={{ width: 8, height: 8, borderRadius: 4, background: s.color, display: "inline-block" }} />{s.label}
              </span>
            ))}
          </div>
        </div>
      )}

      {showForm && (
        <ReservationForm properties={properties} onClose={() => setShowForm(false)}
          onCreate={async (data) => { await saveReservations([...reservations, { id: uid(), ...data }]); setShowForm(false); }} />
      )}
      {openReservation && (
        <ReservationDetail reservation={openReservation} property={properties.find((p) => p.id === openReservation.propertyId)} profile={profile}
          onClose={() => setOpenId(null)}
          onUpdate={async (patch) => { await saveReservations(reservations.map((r) => (r.id === openReservation.id ? { ...r, ...patch } : r))); }}
          onDelete={async () => { await saveReservations(reservations.filter((r) => r.id !== openReservation.id)); setOpenId(null); }} />
      )}
    </div>
  );
}

function ReservationForm({ properties, onClose, onCreate, initial }) {
  const [propertyId, setPropertyId] = useState(initial?.propertyId || properties[0]?.id || "");
  const [guestName, setGuestName] = useState(initial?.guestName || "");
  const [checkIn, setCheckIn] = useState(initial?.checkIn || todayISO());
  const [checkOut, setCheckOut] = useState(initial?.checkOut || todayISO());
  const [source, setSource] = useState(initial?.source || "airbnb");

  const submit = () => {
    if (!propertyId || !guestName.trim() || checkOut <= checkIn) return;
    onCreate({ propertyId, guestName: guestName.trim(), checkIn, checkOut, source });
  };

  return (
    <Sheet onClose={onClose} title={initial ? "Modifier la réservation" : "Nouvelle réservation"}>
      {properties.length === 0 ? (
        <EmptyState icon="home" text="Ajoute d'abord un logement dans l'onglet Logements." />
      ) : (
        <div className="flex flex-col gap-4">
          <Field label="Logement">
            <select value={propertyId} onChange={(e) => setPropertyId(e.target.value)} style={selectStyle}>
              {properties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="Nom du client">
            <input value={guestName} onChange={(e) => setGuestName(e.target.value)} placeholder="Ex. Famille Dupont" style={selectStyle} />
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Arrivée"><input type="date" value={checkIn} onChange={(e) => setCheckIn(e.target.value)} style={selectStyle} /></Field>
            <Field label="Départ"><input type="date" value={checkOut} onChange={(e) => setCheckOut(e.target.value)} style={selectStyle} /></Field>
          </div>
          {checkOut <= checkIn && <p className="text-xs" style={{ color: C.terracotta }}>La date de départ doit être après l'arrivée.</p>}
          <Field label="Plateforme">
            <div className="grid grid-cols-4 gap-2">
              {Object.entries(SOURCES).map(([k, s]) => (
                <button key={k} onClick={() => setSource(k)} className="py-2 rounded-lg text-[11px] font-semibold border"

          </Field>
          <button onClick={submit} disabled={!guestName.trim() || checkOut <= checkIn} className="w-full py-3 rounded-xl font-medium mt-2 disabled:opacity-50" style={{ background: C.ink, color: C.linen }}>
            {initial ? "Enregistrer" : "Ajouter la réservation"}
          </button>
        </div>
      )}
    </Sheet>
  );
}

  const [newItem, setNewItem] = useState("");
  const isOwner = profile.role === "owner";
  const addItem = () => { if (!newItem.trim()) return; onUpdate({ checklist: [...property.checklist, { id: uid(), text: newItem.trim() }] }); setNewItem(""); };
  const removeItem = (id) => onUpdate({ checklist: property.checklist.filter((i) => i.id !== id) });
  return (
    <Sheet onClose={onClose} title={property.name}>
      {property.address && <p style={{ color: C.taupe }} className="flex items-center gap-1 text-sm mb-5"><Icon name="mapPin" size={14} /> {property.address}</p>}
      <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Checklist de ménage</p>
      <div className="flex flex-col gap-2 mb-3">
        {property.checklist.map((item) => (
          <div key={item.id} className="flex items-center justify-between px-3 py-2 rounded-xl" style={{ background: C.linenSoft }}>
            <span style={{ color: C.ink }} className="text-sm">{item.text}</span>
            {isOwner && <button onClick={() => removeItem(item.id)}><Icon name="x" size={14} color={C.taupe} /></button>}
          </div>
        ))}
      </div>
      {isOwner && (
        <>
          <div className="flex gap-2 mb-6">
            <input value={newItem} onChange={(e) => setNewItem(e.target.value)} placeholder="Ajouter une tâche" className="flex-1 px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.linenSoft, color: C.ink }} onKeyDown={(e) => e.key === "Enter" && addItem()} />
            <button onClick={addItem} className="px-4 rounded-xl" style={{ background: C.ink }}><Icon name="plus" size={16} color={C.linen} /></button>
          </div>
          <button onClick={onDelete} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm" style={{ background: "#F3DCCF", color: C.terracotta }}>
            <Icon name="trash" size={15} /> Supprimer ce logement
          </button>
        </>
      )}
    </Sheet>
  );
}

/* =========================================================
   ÉQUIPE TAB
========================================================= */
function EquipeTab({ team, profile }) {
  return (
    <div>
      <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold mb-4">Équipe</h2>
      {team.length === 0 && <EmptyState icon="users" text="Personne n'a encore rejoint le planning." />}
      <div className="flex flex-col gap-2">
        {team.map((t) => (
          <div key={t.id} className="flex items-center gap-3 px-4 py-3 rounded-2xl" style={{ background: "#FFFDF8", border: `1px solid ${C.taupeLight}` }}>
            <div className="flex items-center justify-center rounded-full shrink-0" style={{ width: 36, height: 36, background: t.role === "owner" ? C.terracotta : C.sauge, color: "#fff", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
              {t.name.charAt(0).toUpperCase()}
            </div>
            <div className="flex-1">
              <p style={{ color: C.ink }} className="text-sm font-medium">{t.name} {t.id === profile.id && <span style={{ color: C.taupe }}>(toi)</span>}</p>
              <p style={{ color: C.taupe }} className="text-xs">{t.role === "owner" ? "Propriétaire" : "Équipe de ménage"}</p>
            </div>
          </div>
        ))}
      </div>
      <p style={{ color: C.taupe }} className="text-xs mt-5">Une personne rejoint automatiquement l'équipe en ouvrant l'appli et en choisissant son prénom et son rôle.</p>
    </div>
  );
}

/* =========================================================
   SHARED UI PIECES
========================================================= */
const selectStyle = { width: "100%", padding: "10px 12px", borderRadius: 12, background: "#EFE9DA", color: "#20261F", fontSize: 14, outline: "none", border: "none" };

function Field({ label, children }) {
  return (<label className="block"><span style={{ color: C.taupe }} className="text-xs font-medium uppercase tracking-wide">{label}</span><div className="mt-1.5">{children}</div></label>);
}
function EmptyState({ icon, text }) {
  return (<div className="flex flex-col items-center justify-center text-center py-14 gap-3"><Icon name={icon} size={28} color={C.taupeLight} /><p style={{ color: C.taupe }} className="text-sm max-w-[220px]">{text}</p></div>);
}
function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" style={{ background: "rgba(32,38,31,0.45)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl px-5 pt-5 pb-8 max-h-[85vh] overflow-y-auto" style={{ background: C.linen }}>
        <div className="flex items-center justify-between mb-5">
          <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold pr-4">{title}</h2>
          <button onClick={onClose} className="rounded-full p-1.5 shrink-0" style={{ background: C.linenSoft }}><Icon name="x" size={16} color={C.taupe} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
