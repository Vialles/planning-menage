        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold">Logements</h2>
        {profile.role === "owner" && (
          <button onClick={() => setShowForm(true)} className="rounded-full p-2" style={{ background: C.ink }}><Icon name="plus" size={18} color={C.linen} /></button>
        )}
      </div>
      {properties.length === 0 && <EmptyState icon="home" text="Aucun logement pour l'instant." />}
      <div className="flex flex-col gap-3">
        {properties.map((p) => {
          const active = cleanings.filter((c) => c.propertyId === p.id && c.status !== "termine").length;
          return (
            <button key={p.id} onClick={() => setOpenId(p.id)} className="w-full text-left rounded-2xl px-4 py-3 flex items-center justify-between" style={{ background: "#FFFDF8", border: `1px solid ${C.taupeLight}` }}>
              <div>
                <h3 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="font-semibold text-[15px]">{p.name}</h3>
                {p.address && <p style={{ color: C.taupe }} className="text-xs mt-0.5">{p.address}</p>}
                <p style={{ color: C.taupe }} className="text-xs mt-1">{p.checklist?.length || 0} tâches · {active} ménage{active !== 1 ? "s" : ""} en attente</p>
              </div>
              <Icon name="chevronRight" size={18} color={C.taupe} />
            </button>
          );
        })}
      </div>
      {showForm && (
        <PropertyForm onClose={() => setShowForm(false)}
          onCreate={async (data) => { await saveProperties([...properties, { id: uid(), ...data, checklist: DEFAULT_CHECKLIST.map((text) => ({ id: uid(), text })), linenStock: { clean: 0, dirty: 0, atLaundry: 0 }, kitPrice: 15, cleaningDuration: 120, keyHandoverEnabled: false, keyHandoverPrice: 0, keyHandoverDuration: 30 }]); setShowForm(false); }} />
      )}
      {openProperty && (
        <PropertyDetail property={openProperty} profile={profile} cleanings={cleanings} saveCleanings={saveCleanings} reservations={reservations} saveReservations={saveReservations} onClose={() => setOpenId(null)}
          onUpdate={async (patch) => { await saveProperties(properties.map((p) => (p.id === openProperty.id ? { ...p, ...patch } : p))); }}
          onDelete={async () => { await saveProperties(properties.filter((p) => p.id !== openProperty.id)); setOpenId(null); }} />
      )}
    </div>
  );
}

function Stepper({ label, value, onChange, color, readOnly }) {

    <div className="flex items-center justify-between py-1.5">
      <span style={{ color: C.ink }} className="text-sm">{label}</span>
      <div className="flex items-center gap-2.5">
        {!readOnly && (
          <button onClick={() => onChange(Math.max(0, value - 1))} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: C.linenSoft }}>
            <Icon name="minus" size={14} color={C.taupe} />
          </button>
        )}
        <span style={{ color: color || C.ink, fontFamily: "'IBM Plex Mono', monospace", minWidth: 22 }} className="text-sm font-semibold text-center">{value}</span>
        {!readOnly && (
          <button onClick={() => onChange(value + 1)} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: C.linenSoft }}>
            <Icon name="plus" size={14} color={C.taupe} />
          </button>
        )}
      </div>
    </div>
  );
}

        Créer le logement
      </button>

function PropertyDetail({ property, profile, cleanings, saveCleanings, reservations, saveReservations, onClose, onUpdate, onDelete }) {
  const [newItem, setNewItem] = useState("");
  const [notes, setNotes] = useState(property.notes || "");
  const [kitPrice, setKitPrice] = useState(property.kitPrice != null ? String(property.kitPrice) : "15");
  const [defaultCleaningPrice, setDefaultCleaningPrice] = useState(property.defaultCleaningPrice != null ? String(property.defaultCleaningPrice) : "");
  const [cleaningDuration, setCleaningDuration] = useState(property.cleaningDuration != null ? String(property.cleaningDuration) : "120");
  const [keyHandoverPrice, setKeyHandoverPrice] = useState(property.keyHandoverPrice != null ? String(property.keyHandoverPrice) : "");
  const [keyHandoverDuration, setKeyHandoverDuration] = useState(property.keyHandoverDuration != null ? String(property.keyHandoverDuration) : "30");
  const [icalUrl, setIcalUrl] = useState(property.icalUrl || "");
  const [icsPaste, setIcsPaste] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState("");
  const isOwner = profile.role === "owner";
  const addItem = () => { if (!newItem.trim()) return; onUpdate({ checklist: [...property.checklist, { id: uid(), text: newItem.trim() }] }); setNewItem(""); };
  const removeItem = (id) => onUpdate({ checklist: property.checklist.filter((i) => i.id !== id) });
  const saveNotes = () => onUpdate({ notes });
  const saveKitPrice = () => onUpdate({ kitPrice: Number(kitPrice) || 0 });
  const saveDefaultCleaningPrice = () => onUpdate({ defaultCleaningPrice: defaultCleaningPrice.trim() === "" ? null : Number(defaultCleaningPrice) });
  const saveCleaningDuration = () => onUpdate({ cleaningDuration: Math.max(15, Number(cleaningDuration) || 120) });
  const toggleKeyHandover = () => onUpdate({ keyHandoverEnabled: !property.keyHandoverEnabled });
  const saveKeyHandoverPrice = () => onUpdate({ keyHandoverPrice: Number(keyHandoverPrice) || 0 });
  const saveKeyHandoverDuration = () => onUpdate({ keyHandoverDuration: Math.max(5, Number(keyHandoverDuration) || 30) });
  const saveIcalUrl = () => onUpdate({ icalUrl: icalUrl.trim() });
  const setGoogleColor = (colorId) => onUpdate({ googleColorId: property.googleColorId === colorId ? null : colorId });

  const runSync = async () => {
    if (!icalUrl.trim()) return;
    setSyncing(true);
    setSyncMsg("");
    try {
      const res = await fetch(icalUrl.trim());
      if (!res.ok) throw new Error("http");
      const text = await res.text();
      const count = await syncFromICS(text, property, reservations, saveReservations, cleanings, saveCleanings);
      setSyncMsg(count > 0 ? `${count} réservation${count > 1 ? "s" : ""} importée${count > 1 ? "s" : ""}.` : "Aucune nouvelle réservation à importer.");
    } catch (err) {
      setSyncMsg("Synchronisation automatique impossible depuis le navigateur (souvent bloquée par le site source). Utilise le collage manuel juste en dessous à la place.");
    }
    setSyncing(false);
  };
  const runPasteImport = async () => {
    if (!icsPaste.trim()) return;
    setSyncing(true);
    setSyncMsg("");
    const count = await syncFromICS(icsPaste, property, reservations, saveReservations, cleanings, saveCleanings);
    setSyncMsg(count > 0 ? `${count} réservation${count > 1 ? "s" : ""} importée${count > 1 ? "s" : ""}.` : "Aucune nouvelle réservation trouvée dans ce texte.");
    setSyncing(false);
    setIcsPaste("");
  };

  const stock = property.linenStock || { clean: 0, dirty: 0, atLaundry: 0 };
  const updateStock = (patch) => onUpdate({ linenStock: { ...stock, ...patch } });
  const [resolveQty, setResolveQty] = useState(1);
  const clampedQty = Math.max(1, Math.min(resolveQty, stock.dirty || 1));
  const sendToLaundry = (qty) => {
    const n = Math.min(qty, stock.dirty || 0);
    if (n <= 0) return;
    const log = [...(property.laundryLog || []), { date: todayISO(), count: n }];
    onUpdate({ linenStock: { ...stock, dirty: (stock.dirty || 0) - n, atLaundry: (stock.atLaundry || 0) + n }, laundryLog: log });
    setResolveQty(1);
  };
  const washOurselves = (qty) => {
    const n = Math.min(qty, stock.dirty || 0);
    if (n <= 0) return;
    const log = [...(property.selfWashLog || []), { date: todayISO(), count: n }];
    onUpdate({ linenStock: { ...stock, dirty: (stock.dirty || 0) - n, clean: (stock.clean || 0) + n }, selfWashLog: log });
    setResolveQty(1);
  };
  const receiveClean = () => updateStock({ atLaundry: 0, clean: (stock.clean || 0) + (stock.atLaundry || 0) });

  return (
    <Sheet onClose={onClose} title={property.name}>
      {property.address && <p style={{ color: C.taupe }} className="flex items-center gap-1 text-sm mb-5"><Icon name="mapPin" size={14} /> {property.address}</p>}

      <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Info importante</p>
      {isOwner ? (
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} onBlur={saveNotes} placeholder="Ex. code portail 1234B, wifi: xxxx, chaudière capricieuse…" rows={2}
          className="w-full px-3 py-2 rounded-xl text-sm outline-none mb-5" style={{ background: C.linenSoft, color: C.ink }} />
      ) : (
        <p style={{ color: C.ink, background: C.linenSoft }} className="text-sm rounded-xl px-3 py-2 mb-5">
          {property.notes || <span style={{ color: C.taupe }}>Aucune info particulière.</span>}
        </p>
      )}

      <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Stock de linge</p>
      <div className="rounded-xl px-3 py-1 mb-3" style={{ background: C.linenSoft }}>
        <Stepper label="Propre" value={stock.clean || 0} onChange={(v) => updateStock({ clean: v })} color={C.sauge} readOnly={!isOwner} />
        <div className="border-t" style={{ borderColor: C.taupeLight }} />
        <Stepper label="Sale" value={stock.dirty || 0} onChange={(v) => updateStock({ dirty: v })} color={C.terracotta} readOnly={!isOwner} />
        <div className="border-t" style={{ borderColor: C.taupeLight }} />
        <Stepper label="En blanchisserie" value={stock.atLaundry || 0} onChange={(v) => updateStock({ atLaundry: v })} color={C.or} readOnly={!isOwner} />
      </div>
      {isOwner && (
        <div className="mb-3">
          <div className="flex items-center justify-between mb-2">
            <span style={{ color: C.taupe }} className="text-xs">Quantité de linge sale à traiter</span>
            <div className="flex items-center gap-2">
              <button onClick={() => setResolveQty((q) => Math.max(1, q - 1))} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: C.linenSoft }}>
                <Icon name="minus" size={12} color={C.taupe} />
              </button>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.ink }} className="w-6 text-center text-sm">{clampedQty}</span>
              <button onClick={() => setResolveQty((q) => Math.min(stock.dirty || 1, q + 1))} className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: C.linenSoft }}>
                <Icon name="plus" size={12} color={C.taupe} />
              </button>
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2 mb-2">
            <button onClick={() => sendToLaundry(clampedQty)} disabled={!stock.dirty} className="py-2 rounded-lg text-xs font-medium disabled:opacity-40" style={{ background: C.linenSoft, color: C.ink }}>
              Envoyer en blanchisserie
            </button>
            <button onClick={() => washOurselves(clampedQty)} disabled={!stock.dirty} className="py-2 rounded-lg text-xs font-medium disabled:opacity-40" style={{ background: C.linenSoft, color: C.ink }}>
              Laver par nous-même
            </button>
          </div>
          <button onClick={receiveClean} disabled={!stock.atLaundry} className="w-full py-2 rounded-lg text-xs font-medium disabled:opacity-40" style={{ background: C.linenSoft, color: C.ink }}>
            Récupérer le propre (retour blanchisserie)
          </button>
        </div>
      )}
      <p style={{ color: C.taupe }} className="text-xs mb-2">Le linge lavé par nous-même retourne directement dans le stock propre. Seuls les kits envoyés en blanchisserie sont comptés dans le montant à facturer (page Statistiques).</p>
      {isOwner && (
        <Field label="Prix facturé par kit de linge utilisé (€)">
          <input type="number" min="0" step="0.5" value={kitPrice} onChange={(e) => setKitPrice(e.target.value)} onBlur={saveKitPrice} style={selectStyle} />
        </Field>
      )}
      <div className="h-3" />
      {isOwner && (
        <Field label="Prix normal du ménage pour ce logement (€)">
          <input type="number" min="0" step="1" value={defaultCleaningPrice} onChange={(e) => setDefaultCleaningPrice(e.target.value)} onBlur={saveDefaultCleaningPrice} placeholder="Ex. 60" style={selectStyle} />
        </Field>
      )}
      <p style={{ color: C.taupe }} className="text-xs mt-1.5 mb-2">Ce prix s'applique automatiquement à chaque réservation de ce logement. Sur une réservation précise, tu peux saisir un prix différent (ménage exceptionnellement plus long) — il sera alors utilisé à la place du prix normal.</p>
      <div className="h-3" />
      {isOwner && (
        <Field label="Durée moyenne d'un ménage pour ce logement (minutes)">
          <input type="number" min="15" step="15" value={cleaningDuration} onChange={(e) => setCleaningDuration(e.target.value)} onBlur={saveCleaningDuration} placeholder="Ex. 120" style={selectStyle} />
        </Field>
      )}
      <p style={{ color: C.taupe }} className="text-xs mt-1.5 mb-2">
        Sert à calculer la longueur du créneau dans Google Agenda, et le temps de ménage total dans les statistiques (par personne et par logement). {cleaningDuration && `Actuellement : ${formatDuration(Number(cleaningDuration))} par ménage.`}
      </p>

      {isOwner && (
        <div className="mb-5">
          <button onClick={toggleKeyHandover} className="flex items-center gap-3 w-full text-left mb-3">
            <span className="flex items-center justify-center rounded-md shrink-0" style={{ width: 22, height: 22, background: property.keyHandoverEnabled ? C.sauge : "#fff", border: `1px solid ${property.keyHandoverEnabled ? C.sauge : C.taupeLight}` }}>
              {property.keyHandoverEnabled && <Icon name="check" size={14} color="#fff" />}
            </span>
            <span style={{ color: C.ink }} className="text-sm font-semibold">Proposer la remise de clés en main propre pour ce logement</span>
          </button>
          {property.keyHandoverEnabled && (
            <div className="pl-8 flex flex-col gap-3">
              <Field label="Prix de la remise de clés (€)">
                <input type="number" min="0" step="1" value={keyHandoverPrice} onChange={(e) => setKeyHandoverPrice(e.target.value)} onBlur={saveKeyHandoverPrice} placeholder="Ex. 20" style={selectStyle} />
              </Field>
              <Field label="Durée moyenne d'une remise de clés (minutes)">
                <input type="number" min="5" step="5" value={keyHandoverDuration} onChange={(e) => setKeyHandoverDuration(e.target.value)} onBlur={saveKeyHandoverDuration} placeholder="Ex. 30" style={selectStyle} />
              </Field>
              <p style={{ color: C.taupe }} className="text-xs">
                Une mission "Arrivée client" sera créée automatiquement à la date d'arrivée de chaque réservation de ce logement, en plus du ménage au départ. Elle apparaît dans le planning Ménage et peut être attribuée à quelqu'un de l'équipe.
              </p>
            </div>
          )}
        </div>
      )}

      <p style={{ color: C.ink, marginTop: 20 }} className="text-sm font-semibold mb-2">Checklist de ménage</p>
      <div className="flex flex-col gap-2 mb-3">
        {property.checklist.map((item) => (
          <div key={item.id} className="flex items-center justify-between px-3 py-2 rounded-xl" style={{ background: C.linenSoft }}>
            <span style={{ color: C.ink }} className="text-sm">{item.text}</span>
            {isOwner && <button onClick={() => removeItem(item.id)}><Icon name="x" size={14} color={C.taupe} /></button>}
          </div>
        ))}
      </div>
      {isOwner && (
        <div className="flex gap-2 mb-6">
          <input value={newItem} onChange={(e) => setNewItem(e.target.value)} placeholder="Ajouter une tâche" className="flex-1 px-3 py-2 rounded-xl text-sm outline-none" style={{ background: C.linenSoft, color: C.ink }} onKeyDown={(e) => e.key === "Enter" && addItem()} />
          <button onClick={addItem} className="px-4 rounded-xl" style={{ background: C.ink }}><Icon name="plus" size={16} color={C.linen} /></button>
        </div>
      )}

      {isOwner && (
        <div className="mb-5">
          <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Couleur sur Google Agenda</p>
          <div className="grid grid-cols-6 gap-2 mb-1">
            {GCAL_COLORS.map((c) => {
              const active = property.googleColorId === c.id;
              return (
                <button key={c.id} onClick={() => setGoogleColor(c.id)} title={c.name}
                  className="aspect-square rounded-full flex items-center justify-center"
                  style={{ background: c.hex, border: active ? `3px solid ${C.ink}` : "3px solid transparent" }}>
                  {active && <Icon name="check" size={13} color="#fff" />}
                </button>
              );
            })}
          </div>
          <p style={{ color: C.taupe }} className="text-xs">
            {property.googleColorId ? `Couleur choisie : ${GCAL_COLORS.find((c) => c.id === property.googleColorId)?.name} — tape à nouveau dessus pour l'enlever.` : "Aucune couleur choisie : les ménages de ce logement garderont la couleur par défaut de l'agenda (sauf s'ils sont \"à attribuer\", toujours en violet)."}
          </p>
        </div>
      )}

      {isOwner && (
        <div className="mb-5">
          <p style={{ color: C.ink }} className="text-sm font-semibold mb-2">Synchronisation réservations (Hostaway / iCal)</p>
          <div className="flex gap-2 mb-2">
            <input value={icalUrl} onChange={(e) => setIcalUrl(e.target.value)} onBlur={saveIcalUrl} placeholder="Lien iCal Hostaway (optionnel)" className="flex-1" style={selectStyle} />
          </div>
          <button onClick={runSync} disabled={!icalUrl.trim() || syncing} className="w-full py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-50 mb-2" style={{ background: C.linenSoft, color: C.ink }}>
            {syncing ? <div className="animate-spin"><Icon name="loader" size={14} color={C.taupe} /></div> : <Icon name="calendar" size={14} color={C.taupe} />}
            Synchroniser maintenant
          </button>
          <details className="mb-1">
            <summary style={{ color: C.taupe }} className="text-xs cursor-pointer select-none">La synchronisation automatique ne fonctionne pas ? Coller le calendrier manuellement</summary>
            <textarea value={icsPaste} onChange={(e) => setIcsPaste(e.target.value)} placeholder="Colle ici le contenu du fichier .ics (BEGIN:VCALENDAR...)" rows={3}
              className="w-full px-3 py-2 rounded-xl text-xs outline-none mt-2 mb-2" style={{ background: C.linenSoft, color: C.ink, fontFamily: "'IBM Plex Mono', monospace" }} />
            <button onClick={runPasteImport} disabled={!icsPaste.trim() || syncing} className="w-full py-2 rounded-xl text-xs font-medium disabled:opacity-50" style={{ background: C.ink, color: C.linen }}>
              Importer ce texte
            </button>
          </details>
          {syncMsg && <p style={{ color: C.sauge }} className="text-xs mt-2">{syncMsg}</p>}
          <p style={{ color: C.taupe }} className="text-xs mt-2">Import des dates uniquement (pas le nom ni le téléphone du client) — à compléter à la main dans la fiche de chaque réservation si besoin.</p>
        </div>
      )}

      {isOwner && (
        <button onClick={onDelete} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm mt-6" style={{ background: "#F3DCCF", color: C.terracotta }}>
          <Icon name="trash" size={15} /> Supprimer ce logement
        </button>
      )}
    </Sheet>
  );
}

function StatRow({ left, right, color, last }) {

// Génère et télécharge un fichier Excel (.xlsx) reprenant toutes les
// données affichées sur la page Statistiques pour le mois consulté.
function exportStatsToExcel({ monthLabel, occupancy, byPerson, timeByPerson, timeByProperty, arriveeByPerson, arriveeByProperty, late, revenueByProperty, kitsByProperty, selfWashByProperty, propertyOf, personOf }) {
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    occupancy.map((o) => ({ Logement: o.property.name, "Taux de remplissage (%)": o.pct, "Nuits réservées": o.nights }))
  ), "Occupation");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    byPerson.map((b) => ({ Personne: b.person.name, "Ménages ce mois-ci": b.total, "Dont terminés": b.done }))
  ), "Équipe");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    timeByPerson.map((t) => ({ Personne: t.person.name, "Ménages terminés": t.count, "Temps total (min)": t.minutes, "Temps total": formatDuration(t.minutes) }))
  ), "Temps par personne");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    timeByProperty.map((t) => ({ Logement: t.property.name, "Ménages terminés": t.count, "Temps total (min)": t.minutes, "Temps total": formatDuration(t.minutes) }))
  ), "Temps par logement");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    arriveeByPerson.map((a) => ({ Personne: a.person.name, "Arrivées terminées": a.count, "Temps total": formatDuration(a.minutes), "Montant (€)": a.amount }))
  ), "Arrivées par personne");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    arriveeByProperty.map((a) => ({ Logement: a.property.name, "Arrivées terminées": a.count, "Temps total": formatDuration(a.minutes), "Montant (€)": a.amount }))
  ), "Arrivées par logement");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    late.map((c) => ({
      Logement: propertyOf(c.propertyId)?.name || "", Date: c.date, "Assigné à": personOf(c.assignedToId)?.name || "Non assigné",
      Statut: STATUS[c.status]?.label || c.status,
    }))
  ), "Ménages en retard");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    revenueByProperty.map((r) => ({ Logement: r.property.name, Nuits: r.nights, "Montant ménages (€)": r.hasPrice ? r.revenue : "" }))
  ), "Nuitées et ménages");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    kitsByProperty.map((k) => ({ Logement: k.property.name, "Kits envoyés en blanchisserie": k.count, "Prix par kit (€)": k.price, "Total à facturer (€)": k.total }))
  ), "Blanchisserie");

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    selfWashByProperty.map((k) => ({ Logement: k.property.name, "Kits lavés par nous-même": k.count }))
  ), "Lavé par nous-même");

  const safeMonth = monthLabel.replace(/\s+/g, "-");
  XLSX.writeFile(wb, `statistiques-${safeMonth}.xlsx`);
}

function StatsTab({ properties, cleanings, reservations, team, profile, saveCleanings, saveProperties }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [openLateId, setOpenLateId] = useState(null);

  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const nDays = daysInMonth(year, month);
  const monthLabel = base.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const monthStartISO = isoOf(year, month, 1);
  const nextMonthStartISO = isoOf(year, month + 1, 1);

  const cleaningsThisMonth = cleanings.filter((c) => c.date >= monthStartISO && c.date < nextMonthStartISO);
  const menageThisMonth = cleaningsThisMonth.filter((c) => (c.type || "menage") === "menage");
  const arriveeThisMonth = cleaningsThisMonth.filter((c) => c.type === "arrivee");
  const pctColor = (pct) => (pct < 40 ? C.terracotta : pct < 70 ? C.or : C.sauge);

  const occupancy = properties.map((p) => {
    const nights = reservations.filter((r) => r.propertyId === p.id)
      .reduce((sum, r) => sum + nightsOverlapISO(r.checkIn, r.checkOut, monthStartISO, nextMonthStartISO), 0);
    const pct = Math.round((Math.min(nights, nDays) / nDays) * 100);
    return { property: p, nights, pct };
  });
  const avgPct = occupancy.length ? Math.round(occupancy.reduce((s, o) => s + o.pct, 0) / occupancy.length) : 0;

  const byPerson = team.map((t) => {
    const list = menageThisMonth.filter((c) => c.assignedToId === t.id);
    const done = list.filter((c) => c.status === "termine").length;
    return { person: t, total: list.length, done };
  }).filter((x) => x.total > 0).sort((a, b) => b.total - a.total);

  // Temps de ménage réalisé (basé sur la durée définie par logement, comptée
  // uniquement pour les ménages marqués "Terminé" ce mois-ci). Les missions
  // d'arrivée client sont comptées séparément plus bas.
  const durationOf = (c) => (properties.find((p) => p.id === c.propertyId)?.cleaningDuration || 120);
  const doneThisMonth = menageThisMonth.filter((c) => c.status === "termine");
  const timeByPerson = team.map((t) => {
    const list = doneThisMonth.filter((c) => c.assignedToId === t.id);
    const minutes = list.reduce((s, c) => s + durationOf(c), 0);
    return { person: t, minutes, count: list.length };
  }).filter((x) => x.count > 0).sort((a, b) => b.minutes - a.minutes);
  const totalTimeMinutes = timeByPerson.reduce((s, x) => s + x.minutes, 0);

  const timeByProperty = properties.map((p) => {
    const list = doneThisMonth.filter((c) => c.propertyId === p.id);
    return { property: p, minutes: list.length * (p.cleaningDuration || 120), count: list.length };
  }).filter((x) => x.count > 0).sort((a, b) => b.minutes - a.minutes);

  // Missions "Arrivée client" (remise de clés) — temps, montant à facturer et
  // décompte, par personne et par logement, ce mois-ci.
  const arriveeDone = arriveeThisMonth.filter((c) => c.status === "termine");
  const arriveeByPerson = team.map((t) => {
    const list = arriveeDone.filter((c) => c.assignedToId === t.id);
    const minutes = list.reduce((s, c) => s + (properties.find((p) => p.id === c.propertyId)?.keyHandoverDuration || 30), 0);
    const amount = list.reduce((s, c) => s + (properties.find((p) => p.id === c.propertyId)?.keyHandoverPrice || 0), 0);
    return { person: t, count: list.length, minutes, amount };
  }).filter((x) => x.count > 0).sort((a, b) => b.count - a.count);
  const arriveeByProperty = properties.filter((p) => p.keyHandoverEnabled).map((p) => {
    const list = arriveeDone.filter((c) => c.propertyId === p.id);
    return { property: p, count: list.length, minutes: list.length * (p.keyHandoverDuration || 30), amount: list.length * (p.keyHandoverPrice || 0) };
  }).filter((x) => x.count > 0).sort((a, b) => b.count - a.count);
  const totalArriveeAmount = arriveeByPerson.reduce((s, x) => s + x.amount, 0);

  const late = cleanings.filter((c) => c.date < todayISO() && c.status !== "termine").sort((a, b) => a.date.localeCompare(b.date));

  const revenueByProperty = properties.map((p) => {
    let nights = 0, revenue = 0, hasPrice = false;
    reservations.filter((r) => r.propertyId === p.id).forEach((r) => {
      const n = nightsOverlapISO(r.checkIn, r.checkOut, monthStartISO, nextMonthStartISO);
      nights += n;
      // Le prix est un forfait ménage par séjour (pas un tarif par nuit),
      // rattaché au mois du départ du client. Une réservation peut
      // surcharger le prix normal du logement (ménage exceptionnel) ;
      // sinon on retombe sur le prix normal défini sur le logement.
      const effectivePrice = r.cleaningPrice != null ? r.cleaningPrice : p.defaultCleaningPrice;
      if (effectivePrice && r.checkOut >= monthStartISO && r.checkOut < nextMonthStartISO) { hasPrice = true; revenue += effectivePrice; }
    });
    return { property: p, nights, revenue, hasPrice };
  });
  const totalRevenue = revenueByProperty.reduce((s, r) => s + r.revenue, 0);
  const anyRevenue = revenueByProperty.some((r) => r.hasPrice);

  const kitsByProperty = properties.map((p) => {
    const log = p.laundryLog || [];
    const count = log.filter((e) => e.date >= monthStartISO && e.date < nextMonthStartISO).reduce((s, e) => s + (e.count || 0), 0);
    const price = p.kitPrice || 0;
    return { property: p, count, price, total: count * price };
  });
  const totalKitsAmount = kitsByProperty.reduce((s, k) => s + k.total, 0);
  const totalKitsCount = kitsByProperty.reduce((s, k) => s + k.count, 0);

  const selfWashByProperty = properties.map((p) => {
    const log = p.selfWashLog || [];
    const count = log.filter((e) => e.date >= monthStartISO && e.date < nextMonthStartISO).reduce((s, e) => s + (e.count || 0), 0);
    return { property: p, count };
  });
  const totalSelfWashCount = selfWashByProperty.reduce((s, k) => s + k.count, 0);

  const propertyOf = (id) => properties.find((p) => p.id === id);
  const personOf = (id) => team.find((t) => t.id === id);
  const openLate = openLateId ? cleanings.find((c) => c.id === openLateId) : null;
  const doExport = () => {
    try {
      exportStatsToExcel({ monthLabel, occupancy, byPerson, timeByPerson, timeByProperty, arriveeByPerson, arriveeByProperty, late, revenueByProperty, kitsByProperty, selfWashByProperty, propertyOf, personOf });
    } catch (e) {}
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold">Statistiques</h2>
        {properties.length > 0 && (
          <button onClick={doExport} className="flex items-center gap-1.5 text-xs font-medium px-3 py-2 rounded-xl" style={{ background: C.linenSoft, color: C.ink }}>
            <Icon name="download" size={14} color={C.taupe} /> Exporter en Excel
          </button>
        )}
      </div>

      <div className="flex items-center justify-between mb-5">
        <button onClick={() => setMonthOffset((m) => m - 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronLeft" size={16} color={C.taupe} /></button>
        <p style={{ color: C.ink, fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold capitalize">{monthLabel}</p>
        <button onClick={() => setMonthOffset((m) => m + 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronRight" size={16} color={C.taupe} /></button>
      </div>

      {properties.length === 0 ? (
        <EmptyState icon="home" text="Ajoute un logement pour voir apparaître tes statistiques." />
      ) : (
        <>
          <StatSection title={`Taux de remplissage — moyenne ${avgPct}%`}>
            {occupancy.map((o, i) => (
              <div key={o.property.id} className={`flex items-center justify-between py-2 ${i === occupancy.length - 1 ? "" : "border-b"}`} style={{ borderColor: C.taupeLight }}>
                <span style={{ color: C.ink }} className="text-xs">{o.property.name}</span>
                <div className="flex items-center gap-2">
                  <div className="w-16 h-1.5 rounded-full" style={{ background: C.linenSoft }}>
                    <div className="h-1.5 rounded-full" style={{ width: `${o.pct}%`, background: pctColor(o.pct) }} />
                  </div>
                  <span style={{ color: pctColor(o.pct), fontFamily: "'IBM Plex Mono', monospace", minWidth: 32, textAlign: "right" }} className="text-xs font-semibold">{o.pct}%</span>
                </div>
              </div>
            ))}
          </StatSection>

          <StatSection title="Ménages réalisés par personne ce mois-ci">
            {byPerson.length === 0 ? (
              <p style={{ color: C.taupe }} className="text-xs py-2">Aucun ménage assigné ce mois-ci.</p>
            ) : byPerson.map((x, i) => (
              <StatRow key={x.person.id} left={x.person.name} right={`${x.done}/${x.total} terminés`} last={i === byPerson.length - 1} />
            ))}
          </StatSection>

          <StatSection title="Temps de ménage par personne ce mois-ci">
            {timeByPerson.length === 0 ? (
              <p style={{ color: C.taupe }} className="text-xs py-2">Aucun ménage terminé ce mois-ci.</p>
            ) : (
              <>
                {timeByPerson.map((x) => (
                  <StatRow key={x.person.id} left={x.person.name} right={`${formatDuration(x.minutes)} (${x.count} ménage${x.count !== 1 ? "s" : ""})`} />
                ))}
                <StatRow left="Total" right={formatDuration(totalTimeMinutes)} color={C.ink} last />
              </>
            )}
          </StatSection>

          <StatSection title="Temps de ménage par logement ce mois-ci">
            {timeByProperty.length === 0 ? (
              <p style={{ color: C.taupe }} className="text-xs py-2">Aucun ménage terminé ce mois-ci.</p>
            ) : timeByProperty.map((x, i) => (
              <StatRow key={x.property.id} left={x.property.name} right={`${formatDuration(x.minutes)} (${x.count} ménage${x.count !== 1 ? "s" : ""})`} last={i === timeByProperty.length - 1} />
            ))}
          </StatSection>

          {(arriveeByPerson.length > 0 || arriveeByProperty.length > 0) && (
            <>
              <StatSection title="Arrivées client (remise de clés) par personne ce mois-ci">
                {arriveeByPerson.length === 0 ? (
                  <p style={{ color: C.taupe }} className="text-xs py-2">Aucune arrivée terminée ce mois-ci.</p>
                ) : (
                  <>
                    {arriveeByPerson.map((x) => (
                      <StatRow key={x.person.id} left={x.person.name} right={`${x.count} · ${formatDuration(x.minutes)} · ${x.amount.toFixed(0)} €`} />
                    ))}
                    <StatRow left="Total à verser/facturer" right={`${totalArriveeAmount.toFixed(0)} €`} color={C.violet} last />
                  </>
                )}
              </StatSection>

              <StatSection title="Arrivées client par logement ce mois-ci">
                {arriveeByProperty.length === 0 ? (
                  <p style={{ color: C.taupe }} className="text-xs py-2">Aucune arrivée terminée ce mois-ci.</p>
                ) : arriveeByProperty.map((x, i) => (
                  <StatRow key={x.property.id} left={x.property.name} right={`${x.count} · ${x.amount.toFixed(0)} €`} last={i === arriveeByProperty.length - 1} />
                ))}
              </StatSection>
            </>
          )}

          <StatSection title={`Ménages en retard (${late.length})`}>
            {late.length === 0 ? (
              <p style={{ color: C.sauge }} className="text-xs py-2">Aucun ménage en retard, bravo !</p>
            ) : late.map((c, i) => (
              <button key={c.id} onClick={() => setOpenLateId(c.id)} className={`w-full flex items-center justify-between py-2 text-left ${i === late.length - 1 ? "" : "border-b"}`} style={{ borderColor: C.taupeLight }}>
                <span style={{ color: C.ink }} className="text-xs">{propertyOf(c.propertyId)?.name || "Logement supprimé"}</span>
                <span style={{ color: C.terracotta, fontFamily: "'IBM Plex Mono', monospace" }} className="text-xs font-medium">{fmtDate(c.date)}</span>
              </button>
            ))}
          </StatSection>

          <StatSection title="Nuitées et ménages facturés par logement ce mois-ci">
            {revenueByProperty.map((r, i) => (
              <StatRow key={r.property.id} left={r.property.name}
                right={`${r.nights} nuit${r.nights !== 1 ? "s" : ""}${r.hasPrice ? ` · ${r.revenue.toFixed(0)} €` : ""}`}
                last={i === revenueByProperty.length - 1 && !anyRevenue} />
            ))}
            {anyRevenue && <StatRow left="Total" right={`${totalRevenue.toFixed(0)} €`} color={C.ink} last />}
            {!anyRevenue && <p style={{ color: C.taupe }} className="text-[11px] pb-2">Ajoute un prix de ménage sur tes réservations pour voir apparaître les montants facturés.</p>}
          </StatSection>

          <StatSection title="Kits envoyés en blanchisserie ce mois-ci (à facturer)">
            {kitsByProperty.map((k, i) => (
              <StatRow key={k.property.id} left={k.property.name} right={`${k.count} kit${k.count !== 1 ? "s" : ""} × ${k.price}€ = ${k.total.toFixed(0)}€`} />
            ))}
            <StatRow left="Total à facturer" right={`${totalKitsAmount.toFixed(0)} € (${totalKitsCount} kits)`} color={C.terracotta} last />
          </StatSection>

          <StatSection title="Kits lavés par nous-même ce mois-ci">
            {selfWashByProperty.map((k, i) => (
              <StatRow key={k.property.id} left={k.property.name} right={`${k.count} kit${k.count !== 1 ? "s" : ""}`} />
            ))}
            <StatRow left="Total lavé par nous-même" right={`${totalSelfWashCount} kit${totalSelfWashCount !== 1 ? "s" : ""}`} color={C.sauge} last />
          </StatSection>
        </>
      )}

      {openLate && (
        <CleaningDetail cleaning={openLate} property={propertyOf(openLate.propertyId)} properties={properties} saveProperties={saveProperties} team={team} person={personOf(openLate.assignedToId)} profile={profile}
          onClose={() => setOpenLateId(null)}
          onUpdate={async (patch) => {
            await saveCleanings(cleanings.map((c) => (c.id === openLate.id ? { ...c, ...patch } : c)));
          }}
          onDelete={async () => { await saveCleanings(cleanings.filter((c) => c.id !== openLate.id)); setOpenLateId(null); }} />
      )}
    </div>
  );
}

function EquipeTab({ team, profile, saveTeam, cleanings, saveCleanings, onSelfDeleted }) {
  const [openId, setOpenId] = useState(null);
  const isOwner = profile.role === "owner";
  const openMember = openId ? team.find((t) => t.id === openId) : null;

  return (
    <div>
      <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold mb-4">Équipe</h2>
      {team.length === 0 && <EmptyState icon="users" text="Personne n'a encore rejoint le planning." />}
      <div className="flex flex-col gap-2">
        {team.map((t) => {
          const canOpen = isOwner || t.id === profile.id;
          const Wrapper = canOpen ? "button" : "div";
          const gcalColor = GCAL_COLORS.find((c) => c.id === t.color);
          return (
            <Wrapper key={t.id} onClick={canOpen ? () => setOpenId(t.id) : undefined}
              className="w-full text-left flex items-center gap-3 px-4 py-3 rounded-2xl" style={{ background: "#FFFDF8", border: `1px solid ${C.taupeLight}` }}>
              <div className="flex items-center justify-center rounded-full shrink-0" style={{ width: 36, height: 36, background: gcalColor ? gcalColor.hex : (t.role === "owner" ? C.terracotta : C.sauge), color: "#fff", fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600 }}>
                {t.name.charAt(0).toUpperCase()}
              </div>
              <div className="flex-1">
                <p style={{ color: C.ink }} className="text-sm font-medium">{t.name} {t.id === profile.id && <span style={{ color: C.taupe }}>(toi)</span>}</p>
                <p style={{ color: C.taupe }} className="text-xs">{t.role === "owner" ? "Propriétaire" : "Équipe de ménage"}{gcalColor ? ` · ${gcalColor.name}` : ""}{t.companyName ? ` · ${t.companyName}` : ""}</p>
              </div>
              {canOpen && <Icon name="chevronRight" size={18} color={C.taupe} />}
            </Wrapper>
          );
        })}
      </div>
      <p style={{ color: C.taupe }} className="text-xs mt-5">Une personne rejoint automatiquement l'équipe en ouvrant l'appli et en choisissant son prénom et son rôle. Chacun peut renseigner ses propres informations d'entreprise en tapant sur son profil.</p>

      {openMember && (
        <MemberDetail member={openMember} team={team} isSelf={openMember.id === profile.id} canEditFull={isOwner} onClose={() => setOpenId(null)}
          onUpdate={async (patch) => { await saveTeam(team.map((t) => (t.id === openMember.id ? { ...t, ...patch } : t))); setOpenId(null); }}
          onDelete={async () => {
            await saveTeam(team.filter((t) => t.id !== openMember.id));
            await saveCleanings(cleanings.map((c) => (c.assignedToId === openMember.id ? { ...c, assignedToId: null } : c)));
            setOpenId(null);
            if (openMember.id === profile.id) onSelfDeleted();
          }} />
      )}
    </div>
  );
}

function MemberDetail({ member, team, isSelf, canEditFull, onClose, onUpdate, onDelete }) {
  const [name, setName] = useState(member.name);
  const [role, setRole] = useState(member.role);
  const [color, setColorState] = useState(member.color || null);
  const [companyName, setCompanyName] = useState(member.companyName || "");
  const [siret, setSiret] = useState(member.siret || "");
  const [companyAddress, setCompanyAddress] = useState(member.companyAddress || "");
  const [companyPhone, setCompanyPhone] = useState(member.companyPhone || "");
  const [companyEmail, setCompanyEmail] = useState(member.companyEmail || "");
  const takenColorIds = team.filter((t) => t.id !== member.id && t.color).map((t) => t.color);
  const pickColor = (colorId) => {
    if (takenColorIds.includes(colorId)) return;
    setColorState(color === colorId ? null : colorId);
  };
  const save = () => onUpdate({
    name: name.trim(), role, color,
    companyName: companyName.trim(), siret: siret.trim(), companyAddress: companyAddress.trim(),
    companyPhone: companyPhone.trim(), companyEmail: companyEmail.trim(),
  });
  return (
    <Sheet onClose={onClose} title="Modifier le profil">
      <Field label="Prénom">
        <input value={name} onChange={(e) => setName(e.target.value)} style={selectStyle} />
      </Field>
      {canEditFull && (
        <>
          <div className="h-3" />
          <Field label="Rôle">
            <div className="grid grid-cols-2 gap-3 mt-1.5">
              <button onClick={() => setRole("owner")} className="rounded-xl py-2.5 text-sm font-medium border transition"
                style={{ background: role === "owner" ? C.terracotta : "transparent", color: role === "owner" ? "#fff" : C.taupe, borderColor: C.terracotta }}>
                Propriétaire
              </button>
              <button onClick={() => setRole("cleaner")} className="rounded-xl py-2.5 text-sm font-medium border transition"
                style={{ background: role === "cleaner" ? C.sauge : "transparent", color: role === "cleaner" ? "#fff" : C.taupe, borderColor: C.sauge }}>
                Équipe de ménage
              </button>
            </div>
          </Field>
        </>
      )}
      <div className="h-3" />
      <Field label="Couleur (planning Ménage & Google Agenda)">
        <div className="grid grid-cols-6 gap-2 mb-1 mt-1.5">
          {GCAL_COLORS.map((c) => {
            const active = color === c.id;
            const takenByOther = takenColorIds.includes(c.id);
            return (
              <button key={c.id} onClick={() => pickColor(c.id)} disabled={takenByOther} title={takenByOther ? `${c.name} — déjà prise` : c.name}
                className="aspect-square rounded-full flex items-center justify-center disabled:opacity-25 disabled:cursor-not-allowed"
                style={{ background: c.hex, border: active ? `3px solid ${C.ink}` : "3px solid transparent" }}>
                {active && <Icon name="check" size={13} color="#fff" />}
              </button>
            );
          })}
        </div>
        <p style={{ color: C.taupe }} className="text-xs">Chaque couleur ne peut être prise que par une seule personne. Les couleurs grisées sont déjà utilisées.</p>
      </Field>

      <div className="h-4" />
      <p style={{ color: C.ink }} className="text-sm font-semibold mb-1">Informations d'entreprise</p>
      <p style={{ color: C.taupe }} className="text-xs mb-3">Utilisées comme en-tête sur les rapports de passage (Word) générés pour tes ménages — utile pour la preuve d'intervention.</p>
      <div className="flex flex-col gap-3">
        <Field label="Nom de l'entreprise / auto-entrepreneur">
          <input value={companyName} onChange={(e) => setCompanyName(e.target.value)} placeholder="Ex. Camille Nettoyage" style={selectStyle} />
        </Field>
        <Field label="SIRET">
          <input value={siret} onChange={(e) => setSiret(e.target.value)} placeholder="Ex. 123 456 789 00012" style={selectStyle} />
        </Field>
        <Field label="Adresse">
          <input value={companyAddress} onChange={(e) => setCompanyAddress(e.target.value)} placeholder="Adresse professionnelle" style={selectStyle} />
        </Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Téléphone">
            <input type="tel" value={companyPhone} onChange={(e) => setCompanyPhone(e.target.value)} style={selectStyle} />
          </Field>
          <Field label="Email">
            <input type="email" value={companyEmail} onChange={(e) => setCompanyEmail(e.target.value)} style={selectStyle} />
          </Field>
        </div>
      </div>

      <button disabled={!name.trim()} onClick={save} className="w-full py-3 rounded-xl font-medium mt-5 disabled:opacity-50" style={{ background: C.ink, color: C.linen }}>
        Enregistrer
      </button>
      {isSelf && <p style={{ color: C.taupe }} className="text-xs mt-3">C'est ton propre profil.</p>}
      {canEditFull && (
        <>
          <button onClick={onDelete} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm mt-3" style={{ background: "#F3DCCF", color: C.terracotta }}>
            <Icon name="trash" size={15} /> Supprimer ce profil
          </button>
          <p style={{ color: C.taupe }} className="text-xs mt-2">Les ménages déjà assignés à cette personne repasseront en "non assigné".</p>
        </>
      )}
    </Sheet>
  );
}

/* =========================================================
   SHARED UI PIECES
========================================================= */
const selectStyle = { width: "100%", padding: "10px 12px", borderRadius: 12, background: "#EFE9DA", color: "#20261F", fontSize: 14, outline: "none", border: "none" };

function Field({ label, children }) {
  return (<label className="block"><span style={{ color: C.taupe }} className="text-xs font-medium uppercase tracking-wide">{label}</span><div className="mt-1.5">{children}</div></label>);
}
function EmptyState({ icon, text }) {
  return (<div className="flex flex-col items-center justify-center text-center py-14 gap-3"><Icon name={icon} size={28} color={C.taupeLight} /><p style={{ color: C.taupe }} className="text-sm max-w-[220px]">{text}</p></div>);
}
function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center" style={{ background: "rgba(32,38,31,0.45)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-full max-w-md rounded-t-3xl md:rounded-3xl px-5 pt-5 pb-8 md:pb-6 max-h-[85vh] overflow-y-auto md:shadow-2xl" style={{ background: C.linen }}>
        <div className="flex items-center justify-between mb-5">
          <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold pr-4">{title}</h2>
          <button onClick={onClose} className="rounded-full p-1.5 shrink-0" style={{ background: C.linenSoft }}><Icon name="x" size={16} color={C.taupe} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>

<script>
  // On transforme nous-mêmes le code ci-dessus avec Babel, en forçant le mode
  // "classic" (React.createElement) plutôt que le nouveau JSX runtime par
  // défaut, qui génère des instructions "import" incompatibles avec un simple
  // fichier HTML sans serveur de build.
  (function () {
    const source = document.getElementById("app-source").textContent;
    const output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    const script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  })();
</script>
</body>
