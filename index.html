function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
// Toutes les dates de l'appli sont des chaînes "YYYY-MM-DD". On les convertit
// TOUJOURS en objets Date locaux (jamais UTC) pour éviter tout décalage lié
// au fuseau horaire — c'était la cause du bug de dates qui ne correspondaient
// pas à ce qui avait été saisi.
function parseISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function todayISO() {
  const d = new Date();
  return isoOf(d.getFullYear(), d.getMonth(), d.getDate());
}
function fmtDate(iso) {
  return parseISO(iso).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
}
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function isoOf(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
const DAY_LETTERS = ["D", "L", "M", "M", "J", "V", "S"]; // getDay(): 0=dimanche..6=samedi
function dayLetter(y, m, d) { return DAY_LETTERS[new Date(y, m, d).getDay()]; }
function isWeekend(y, m, d) { const g = new Date(y, m, d).getDay(); return g === 0 || g === 6; }
function nightsOverlapISO(checkIn, checkOut, rangeStartISO, rangeEndExclusiveISO) {
  if (checkOut <= rangeStartISO || checkIn >= rangeEndExclusiveISO) return 0;
  const start = checkIn < rangeStartISO ? rangeStartISO : checkIn;
  const end = checkOut > rangeEndExclusiveISO ? rangeEndExclusiveISO : checkOut;
  return Math.max(0, Math.round((parseISO(end) - parseISO(start)) / 86400000));
}
// Quand un ménage passe à "terminé" pour la première fois, un kit de linge
// propre est automatiquement consommé pour ce logement (propre -> sale).
async function applyKitConsumption(cleaning, patch, properties, saveProperties) {
  if (patch.status === "termine" && cleaning.status !== "termine" && !cleaning.kitUsed) {
    const prop = properties.find((p) => p.id === cleaning.propertyId);
    if (prop) {
      const stock = prop.linenStock || { clean: 0, dirty: 0, atLaundry: 0 };
      const nextStock = { ...stock, clean: Math.max(0, (stock.clean || 0) - 1), dirty: (stock.dirty || 0) + 1 };
      await saveProperties(properties.map((p) => (p.id === prop.id ? { ...p, linenStock: nextStock } : p)));
    }
    return { kitUsed: true };
  }
  return {};
}

// Ajout manuel de linge sale depuis la fiche du ménage — quantité libre,
// utile pour les logements qui nécessitent plusieurs kits par ménage.
async function addManualDirtyKit(propertyId, properties, saveProperties, qty) {
  const n = Math.max(1, qty || 1);
  const next = properties.map((p) => {
    if (p.id !== propertyId) return p;
    const stock = p.linenStock || { clean: 0, dirty: 0, atLaundry: 0 };
    return { ...p, linenStock: { ...stock, clean: Math.max(0, (stock.clean || 0) - n), dirty: (stock.dirty || 0) + n } };
  });
  await saveProperties(next);
}

// Automatisation : à la fin de chaque séjour (date de départ), un ménage est
// créé automatiquement pour le logement concerné. Si la remise de clés en
// main propre est activée sur le logement, une mission "Arrivée client" est
// aussi créée à la date d'arrivée. `sourceReservationId` garde le lien entre
// la mission et la réservation qui l'a générée ; `type` distingue les deux
// ("menage" par défaut si absent, pour les ménages créés avant cette
// fonctionnalité).
async function createLinkedMission(reservation, cleanings, saveCleanings, type, date, time) {
  const exists = cleanings.some((c) => c.propertyId === reservation.propertyId && c.date === date && (c.type || "menage") === type);
  if (exists) return; // déjà une mission de ce type ce jour-là pour ce logement, on ne duplique pas
  const next = [...cleanings, {
    id: uid(), propertyId: reservation.propertyId, date, time,
    assignedToId: null, status: "a_attribuer", checklistDone: {}, sourceReservationId: reservation.id, type,
  }];
  await saveCleanings(next);
}
async function createLinkedCleaning(reservation, cleanings, saveCleanings) {
  await createLinkedMission(reservation, cleanings, saveCleanings, "menage", reservation.checkOut, "11:00");
}
async function createLinkedArrival(reservation, cleanings, saveCleanings) {
  await createLinkedMission(reservation, cleanings, saveCleanings, "arrivee", reservation.checkIn, "16:00");
}
async function syncLinkedMission(reservation, cleanings, saveCleanings, type, date) {
  const linked = cleanings.find((c) => c.sourceReservationId === reservation.id && (c.type || "menage") === type);
  if (!linked) { await createLinkedMission(reservation, cleanings, saveCleanings, type, date, type === "arrivee" ? "16:00" : "11:00"); return; }
  if (linked.date !== date || linked.propertyId !== reservation.propertyId) {
    const clash = cleanings.some((c) => c.id !== linked.id && c.propertyId === reservation.propertyId && c.date === date && (c.type || "menage") === type);
    if (!clash) {
      await saveCleanings(cleanings.map((c) => (c.id === linked.id ? { ...c, date, propertyId: reservation.propertyId } : c)));
    }
  }
}
// Synchronise à la fois le ménage (départ) et, si activée sur le logement,
// la mission d'arrivée client — à appeler après la création ou la
// modification d'une réservation.
async function syncReservationMissions(reservation, property, cleanings, saveCleanings) {
  await syncLinkedMission(reservation, cleanings, saveCleanings, "menage", reservation.checkOut);
  if (property?.keyHandoverEnabled) {
    await syncLinkedMission(reservation, cleanings, saveCleanings, "arrivee", reservation.checkIn);
  }
}
async function handleReservationDeleted(reservation, cleanings, saveCleanings) {
  const linked = cleanings.filter((c) => c.sourceReservationId === reservation.id);
  if (linked.length === 0) return;
  let next = [...cleanings];
  for (const l of linked) {
    if (l.status !== "termine") {
      // mission pas encore terminée : on la retire avec la réservation
      next = next.filter((c) => c.id !== l.id);
    } else {
      // du travail a déjà été fait dessus : on la garde, juste dé-liée
      next = next.map((c) => (c.id === l.id ? { ...c, sourceReservationId: null } : c));
    }
  }
  await saveCleanings(next);
}
// Balaie toutes les réservations existantes et crée les missions manquantes
// (ménage + arrivée client si activée) en une seule fois — utile pour
// rattraper les réservations saisies avant que l'automatisation n'existe.
async function generateMissingCleanings(reservations, properties, cleanings, saveCleanings) {
  const next = [...cleanings];
  let added = 0;
  for (const r of reservations) {
    const property = properties.find((p) => p.id === r.propertyId);
    const alreadyMenage = next.some((c) => c.sourceReservationId === r.id && (c.type || "menage") === "menage");
    const clashMenage = next.some((c) => c.propertyId === r.propertyId && c.date === r.checkOut && (c.type || "menage") === "menage");
    if (!alreadyMenage && !clashMenage) {
      next.push({ id: uid(), propertyId: r.propertyId, date: r.checkOut, time: "11:00", assignedToId: null, status: "a_attribuer", checklistDone: {}, sourceReservationId: r.id, type: "menage" });
      added++;
    }
    if (property?.keyHandoverEnabled) {
      const alreadyArrivee = next.some((c) => c.sourceReservationId === r.id && c.type === "arrivee");
      const clashArrivee = next.some((c) => c.propertyId === r.propertyId && c.date === r.checkIn && c.type === "arrivee");
      if (!alreadyArrivee && !clashArrivee) {
        next.push({ id: uid(), propertyId: r.propertyId, date: r.checkIn, time: "16:00", assignedToId: null, status: "a_attribuer", checklistDone: {}, sourceReservationId: r.id, type: "arrivee" });
        added++;
      }
    }
  }
  if (added > 0) await saveCleanings(next);
  return added;
}

// Import iCal (Hostaway, ou tout autre calendrier .ics standard)
// ---------------------------------------------------------
function parseICS(text) {
  // Les lignes repliées (RFC 5545) commencent par un espace/tabulation : on
  // les rattache à la ligne précédente avant de découper.
  const unfolded = text.replace(/\r\n/g, "\n").replace(/\n[ \t]/g, "");
  const lines = unfolded.split("\n");
  const events = [];
  let cur = null;
  const extractDate = (line) => {
    const val = line.split(":").pop().trim();
    const digits = val.replace(/[^0-9]/g, "").slice(0, 8);
    if (digits.length < 8) return null;
    return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
  };
  for (const raw of lines) {
    const line = raw.trim();
    if (line.startsWith("BEGIN:VEVENT")) cur = {};
    else if (line.startsWith("END:VEVENT")) { if (cur && cur.dtstart && cur.dtend) events.push(cur); cur = null; }
    else if (cur) {
      if (line.startsWith("DTSTART")) cur.dtstart = extractDate(line);
      else if (line.startsWith("DTEND")) cur.dtend = extractDate(line);
      else if (line.startsWith("SUMMARY")) cur.summary = line.split(":").slice(1).join(":").trim();
    }
  }
  return events;
}
async function syncFromICS(icsText, property, reservations, saveReservations, cleanings, saveCleanings) {
  const events = parseICS(icsText);
  const nextRes = [...reservations];
  const created = [];
  for (const ev of events) {
    if (!ev.dtstart || !ev.dtend || ev.dtend <= ev.dtstart) continue;
    const exists = nextRes.some((r) => r.propertyId === property.id && r.checkIn === ev.dtstart && r.checkOut === ev.dtend);
    if (exists) continue;
    const newRes = {
      id: uid(), propertyId: property.id, guestName: ev.summary && ev.summary !== "Reserved" && ev.summary !== "Blocked" ? ev.summary : "Réservation Hostaway",
      checkIn: ev.dtstart, checkOut: ev.dtend, source: "hostaway", cleaningPrice: null, guestPhone: "",
    };
    nextRes.push(newRes);
    created.push(newRes);
  }
  if (created.length > 0) {
    await saveReservations(nextRes);
    for (const r of created) await syncReservationMissions(r, property, cleanings, saveCleanings);
  }
  return created.length;
}

/* ---------------------------------------------------------
   FIREBASE — couche de stockage
   'profile' reste local à l'appareil (localStorage).
   Tout le reste est partagé en temps réel via Firestore
   (collection 'app', un document par clé).
--------------------------------------------------------- */
let db = null, authReady = null;
function initFirebase() {
  if (firebase.apps.length) return;
  firebase.initializeApp(window.__FIREBASE_CONFIG__);
  db = firebase.firestore();
  authReady = new Promise((resolve) => {
    firebase.auth().onAuthStateChanged((u) => {
      if (u) resolve(u);
      else firebase.auth().signInAnonymously().catch(() => resolve(null));
    });
  });
}

async function cloudGet(key) {
  await authReady;
  try {
    const snap = await db.collection("app").doc(key).get();
    return snap.exists ? snap.data().value : null;
  } catch (e) { return null; }
}
async function cloudSet(key, value) {
  await authReady;
  try {
    await db.collection("app").doc(key).set({ value, updatedAt: Date.now() });
    return true;
  } catch (e) { return false; }
}
function cloudListen(key, cb) {
  db.collection("app").doc(key).onSnapshot(
    (snap) => cb(snap.exists ? snap.data().value : null),
    () => {}
  );
}
function localGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function localSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

function compressImage(file, maxW = 700, quality = 0.55) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Partage les photos d'un ménage via le menu de partage natif du téléphone
// (WhatsApp, Messages, email...). Repose sur la Web Share API — disponible
// sur la plupart des navigateurs mobiles, pas forcément sur ordinateur.
async function shareCleaningPhotos(photos, property) {
  if (!photos || photos.length === 0) return { ok: false, reason: "no-photos" };
  try {
    const files = await Promise.all(photos.map(async (src, i) => {
      const res = await fetch(src);
      const blob = await res.blob();
      const filename = `menage-${property?.name || "logement"}-${i + 1}.jpg`.replace(/\s+/g, "-");
      return new File([blob], filename, { type: "image/jpeg" });
    }));
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: `Photos — ${property?.name || "logement"}`, text: `Photos du ménage — ${property?.name || "logement"}` });
      return { ok: true };
    }
    return { ok: false, reason: "not-supported" };
  } catch (e) {
    if (e?.name === "AbortError") return { ok: false, reason: "cancelled" };
    return { ok: false, reason: "error" };
  }
}

/* ---------------------------------------------------------
   GOOGLE AGENDA — synchronisation des ménages assignés
   Chaque personne connecte SON compte Google (OAuth côté navigateur,
   aucune clé secrète nécessaire). Les jetons et le carnet de
   correspondance ménage <-> événement restent uniquement sur cet
   appareil (localStorage), pas dans Firebase.
--------------------------------------------------------- */
const GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";

function gcalConfigured() {
  return window.__GOOGLE_CLIENT_ID__ && !window.__GOOGLE_CLIENT_ID__.startsWith("REMPLACE_MOI") && window.google && window.google.accounts;
}
function gcalIsConnected(profileId) {
  return !!localStorage.getItem(`gcal-connected:${profileId}`);
}
function gcalDisconnect(profileId) {
  localStorage.removeItem(`gcal-token:${profileId}`);
  localStorage.removeItem(`gcal-connected:${profileId}`);
  localStorage.removeItem(`gcal-ledger:${profileId}`);
}
function gcalLedger(profileId) {
  try { return JSON.parse(localStorage.getItem(`gcal-ledger:${profileId}`) || "{}"); } catch (e) { return {}; }
}
function gcalSaveLedger(profileId, ledger) {
  localStorage.setItem(`gcal-ledger:${profileId}`, JSON.stringify(ledger));
}
function gcalTokenClient(callback) {
  return google.accounts.oauth2.initTokenClient({ client_id: window.__GOOGLE_CLIENT_ID__, scope: GCAL_SCOPE, callback });
}
function gcalConnect(profileId) {
  return new Promise((resolve, reject) => {
    if (!gcalConfigured()) { reject(new Error("not-configured")); return; }
    try {
      const client = gcalTokenClient((resp) => {
        if (resp.error) { reject(resp); return; }
        localStorage.setItem(`gcal-token:${profileId}`, JSON.stringify({ token: resp.access_token, expiresAt: Date.now() + (resp.expires_in - 60) * 1000 }));
        localStorage.setItem(`gcal-connected:${profileId}`, "1");
        resolve(resp.access_token);
      });
      client.requestAccessToken({ prompt: "consent" });
    } catch (e) { reject(e); }
  });
}
function gcalGetToken(profileId) {
  return new Promise((resolve) => {
    const raw = localStorage.getItem(`gcal-token:${profileId}`);
    if (raw) {
      const cached = JSON.parse(raw);
      if (cached.expiresAt > Date.now()) { resolve(cached.token); return; }
    }
    if (!gcalIsConnected(profileId) || !gcalConfigured()) { resolve(null); return; }
    // Jeton expiré : ré-autorisation silencieuse (déjà accordée précédemment).
    try {
      const client = gcalTokenClient((resp) => {
        if (resp.error) { resolve(null); return; }
        localStorage.setItem(`gcal-token:${profileId}`, JSON.stringify({ token: resp.access_token, expiresAt: Date.now() + (resp.expires_in - 60) * 1000 }));
        resolve(resp.access_token);
      });
      client.requestAccessToken({ prompt: "" });
    } catch (e) { resolve(null); }
  });
}
async function gcalApi(method, path, token, body) {
  const res = await fetch(`https://www.googleapis.com/calendar/v3${path}`, {
    method, headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined,
  });
  if (method === "DELETE") { if (!res.ok && res.status !== 410 && res.status !== 404) throw new Error("gcal delete failed"); return null; }
  if (!res.ok) throw new Error("gcal api failed: " + res.status);
  return res.json();
}
// Palette officielle des couleurs d'événement Google Agenda (fixe, ce sont
// les seules disponibles via l'API).
const GCAL_COLORS = [
  { id: "1", name: "Lavande", hex: "#7986CB" },
  { id: "2", name: "Sauge", hex: "#33B679" },
  { id: "3", name: "Raisin", hex: "#8E24AA" },
  { id: "4", name: "Flamant", hex: "#E67C73" },
  { id: "5", name: "Banane", hex: "#F6BF26" },
  { id: "6", name: "Mandarine", hex: "#F4511E" },
  { id: "7", name: "Paon", hex: "#039BE5" },
  { id: "8", name: "Graphite", hex: "#616161" },
  { id: "9", name: "Myrtille", hex: "#3F51B5" },
  { id: "10", name: "Basilic", hex: "#0B8043" },
  { id: "11", name: "Tomate", hex: "#D50000" },
];
function cleaningSignature(c, property) {
  const isArrival = c.type === "arrivee";
  const duration = isArrival ? property?.keyHandoverDuration : property?.cleaningDuration;
  return `${c.date}|${c.time}|${c.propertyId}|${c.status}|${c.notes || ""}|${property?.googleColorId || ""}|${duration || ""}|${c.type || "menage"}|v3`;
}
function cleaningEndDateTime(dateStr, timeStr, durationMinutes) {
  const start = new Date(`${dateStr}T${timeStr}:00`);
  const end = new Date(start.getTime() + durationMinutes * 60000);
  const pad = (n) => String(n).padStart(2, "0");
  return `${end.getFullYear()}-${pad(end.getMonth() + 1)}-${pad(end.getDate())}T${pad(end.getHours())}:${pad(end.getMinutes())}:00`;
}
function cleaningToEvent(cleaning, property) {
  const isArrival = cleaning.type === "arrivee";
  const time = cleaning.time || (isArrival ? "16:00" : "11:00");
  const duration = (isArrival ? property?.keyHandoverDuration : property?.cleaningDuration) || (isArrival ? 30 : 120);
  return {
    summary: `${property?.name || "Logement"} — ${isArrival ? "Arrivée client" : "Ménage"}`,
    location: property?.address || "",
    description: `Statut : ${STATUS[cleaning.status]?.label || cleaning.status}${isArrival && property?.keyHandoverPrice != null ? `\nPrix : ${property.keyHandoverPrice} €` : ""}${cleaning.notes ? "\n" + cleaning.notes : ""}\nSynchronisé depuis Planning Ménage.`,
    start: { dateTime: `${cleaning.date}T${time}:00`, timeZone: "Europe/Paris" },
    end: { dateTime: cleaningEndDateTime(cleaning.date, time, duration), timeZone: "Europe/Paris" },
    // La couleur choisie sur le logement s'applique par défaut ; une mission
    // "à attribuer" reste signalée en violet (Raisin) quoi qu'il arrive, pour
    // ne jamais perdre ce repère d'urgence.
    ...(cleaning.status === "a_attribuer" ? { colorId: "3" } : property?.googleColorId ? { colorId: property.googleColorId } : {}),
  };
}
function formatDuration(minutes) {
  const total = Math.max(0, Math.round(minutes || 0));
  const h = Math.floor(total / 60), m = total % 60;
  if (h === 0) return `${m}min`;
  return m > 0 ? `${h}h${String(m).padStart(2, "0")}` : `${h}h`;
}

/* ---------------------------------------------------------
   RAPPORT DE PASSAGE (Word) — preuve d'intervention à valeur
   juridique : infos de l'intervenant (entreprise), du logement,
   de la mission, checklist réalisée et photos prises sur place.
--------------------------------------------------------- */
function dataUrlToUint8Array(dataUrl) {
  const base64 = dataUrl.split(",")[1] || dataUrl;
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function reportInfoRow(label, value) {
  const { TableRow, TableCell, Paragraph, TextRun, WidthType } = docx;
  return new TableRow({
    children: [
      new TableCell({
        width: { size: 28, type: WidthType.PERCENTAGE },
        shading: { fill: "F6F2E9" },
        children: [new Paragraph({ children: [new TextRun({ text: label, bold: true, size: 20 })] })],
      }),
      new TableCell({
        width: { size: 72, type: WidthType.PERCENTAGE },
        children: [new Paragraph({ children: [new TextRun({ text: String(value || "—"), size: 20 })] })],
      }),
    ],
  });
}
async function generateCleaningReport(cleaning, property, person, photos) {
  const { Document, Packer, Paragraph, TextRun, HeadingLevel, Table, TableRow, TableCell, WidthType, ImageRun, AlignmentType, BorderStyle } = docx;
  const isArrival = cleaning.type === "arrivee";
  const children = [];

  children.push(new Paragraph({
    children: [new TextRun({ text: "Rapport de passage", bold: true, size: 40, color: "20261F" })],
    spacing: { after: 80 },
  }));
  children.push(new Paragraph({
    children: [new TextRun({ text: isArrival ? "Arrivée client — remise de clés" : "Ménage", size: 24, color: "7C6B9C", bold: true })],
    spacing: { after: 240 },
  }));

  // Intervenant / entreprise
  children.push(new Paragraph({ text: "Intervenant", heading: HeadingLevel.HEADING_3, spacing: { after: 100 } }));
  const introRows = [reportInfoRow("Nom", person?.name || "Non assigné")];
  if (person?.companyName) introRows.push(reportInfoRow("Entreprise", person.companyName));
  if (person?.siret) introRows.push(reportInfoRow("SIRET", person.siret));
  if (person?.companyAddress) introRows.push(reportInfoRow("Adresse", person.companyAddress));
  if (person?.companyPhone) introRows.push(reportInfoRow("Téléphone", person.companyPhone));
  if (person?.companyEmail) introRows.push(reportInfoRow("Email", person.companyEmail));
  children.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: introRows }));

  // Mission
  children.push(new Paragraph({ text: "Détails de la mission", heading: HeadingLevel.HEADING_3, spacing: { before: 280, after: 100 } }));
  children.push(new Table({
    width: { size: 100, type: WidthType.PERCENTAGE },
    rows: [
      reportInfoRow("Logement", property?.name),
      reportInfoRow("Adresse", property?.address),
      reportInfoRow("Type de mission", isArrival ? "Arrivée client (remise de clés)" : "Ménage"),
      reportInfoRow("Date", fmtDate(cleaning.date)),
      reportInfoRow("Heure", cleaning.time),
      reportInfoRow("Statut", STATUS[cleaning.status]?.label || cleaning.status),
      ...(isArrival && property?.keyHandoverPrice != null ? [reportInfoRow("Prix de la mission", `${property.keyHandoverPrice} €`)] : []),
    ],
  }));

  // Checklist (ménage uniquement)
  if (!isArrival) {
    const checklist = property?.checklist || [];
    const doneMap = cleaning.checklistDone || {};
    children.push(new Paragraph({ text: "Checklist réalisée", heading: HeadingLevel.HEADING_3, spacing: { before: 280, after: 100 } }));
    if (checklist.length === 0) {
      children.push(new Paragraph({ children: [new TextRun({ text: "Aucune checklist définie pour ce logement.", italics: true, size: 20 })] }));
    } else {
      checklist.forEach((item) => {
        const checked = !!doneMap[item.id];
        children.push(new Paragraph({
          children: [new TextRun({ text: `${checked ? "☑" : "☐"}  ${item.text}`, size: 20, color: checked ? "20261F" : "9C9284" })],
          spacing: { after: 40 },
        }));
      });
    }
  }

  // Notes
  if (cleaning.notes) {
    children.push(new Paragraph({ text: "Notes", heading: HeadingLevel.HEADING_3, spacing: { before: 280, after: 100 } }));
    children.push(new Paragraph({ children: [new TextRun({ text: cleaning.notes, size: 20 })] }));
  }

  // Photos (déjà stockées par l'appli pour ce ménage)
  children.push(new Paragraph({ text: "Photos prises sur place", heading: HeadingLevel.HEADING_3, spacing: { before: 280, after: 100 } }));
  if (!photos || photos.length === 0) {
    children.push(new Paragraph({ children: [new TextRun({ text: "Aucune photo jointe à cette mission.", italics: true, size: 20 })] }));
  } else {
    for (const src of photos) {
      try {
        const bytes = dataUrlToUint8Array(src);
        children.push(new Paragraph({
          children: [new ImageRun({ data: bytes, transformation: { width: 380, height: 285 } })],
          spacing: { after: 200 },
        }));
      } catch (e) {}
    }
  }

  children.push(new Paragraph({
    children: [new TextRun({ text: `Rapport généré le ${new Date().toLocaleDateString("fr-FR")} à ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })} via Planning Ménage.`, italics: true, size: 16, color: "9C9284" })],
    spacing: { before: 400 },
  }));

  const doc = new Document({
    sections: [{ properties: {}, children }],
    styles: { default: { document: { run: { font: "Calibri" } } } },
  });
  const blob = await Packer.toBlob(doc);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `rapport-${(property?.name || "logement")}-${cleaning.date}.docx`.replace(/\s+/g, "-");
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Synchronise TOUS les ménages assignés à cette personne (passés et à venir)
// vers son Google Agenda personnel. Crée / met à jour / retire les
// événements en fonction des changements depuis le dernier passage.
async function syncMyCleanings(profile, cleanings, properties) {
  const token = await gcalGetToken(profile.id);
  if (!token) throw new Error("not-connected");
  const ledger = gcalLedger(profile.id);
  const mine = cleanings.filter((c) => c.assignedToId === profile.id);
  let created = 0, updated = 0, removed = 0;

  for (const c of mine) {
    const property = properties.find((p) => p.id === c.propertyId);
    const sig = cleaningSignature(c, property);
    const entry = ledger[c.id];
    if (!entry) {
      const ev = await gcalApi("POST", "/calendars/primary/events", token, cleaningToEvent(c, property));
      ledger[c.id] = { eventId: ev.id, sig };
      created++;
    } else if (entry.sig !== sig) {
      await gcalApi("PATCH", `/calendars/primary/events/${entry.eventId}`, token, cleaningToEvent(c, property));
      ledger[c.id] = { eventId: entry.eventId, sig };
      updated++;
    }
  }
  const mineIds = new Set(mine.map((c) => c.id));
  for (const cleaningId of Object.keys(ledger)) {
    if (!mineIds.has(cleaningId)) {
      await gcalApi("DELETE", `/calendars/primary/events/${ledger[cleaningId].eventId}`, token);
      delete ledger[cleaningId];
      removed++;
    }
  }
  gcalSaveLedger(profile.id, ledger);
  return { created, updated, removed };
}

function App() {

  const [profile, setProfile] = useState(null);

  const [cleanings, setCleanings] = useState([]);

    if (tab === "stats" && profile?.role !== "owner") setTab("planning");
  }, [tab, profile?.role]);
  const [error, setError] = useState("");
  const [offline, setOffline] = useState(false);
  const [showGCal, setShowGCal] = useState(false);

  useEffect(() => {
    try {
      initFirebase();
    } catch (e) {
      setError("Configuration Firebase manquante ou invalide — voir README.md.");
      setLoading(false);
      return;
    }
    const p = localGet("profile");
    if (p) { try { setProfile(JSON.parse(p)); } catch (e) {} }

    let received = 0;
    const mark = () => { received++; if (received >= 4) setLoading(false); };
    cloudListen("team", (v) => { setTeam(v ? JSON.parse(v) : []); mark(); });
    cloudListen("properties", (v) => { setProperties(v ? JSON.parse(v) : []); mark(); });
    cloudListen("cleanings", (v) => { setCleanings(v ? JSON.parse(v) : []); mark(); });
    cloudListen("reservations", (v) => { setReservations(v ? JSON.parse(v) : []); mark(); });

    const timeout = setTimeout(() => setLoading(false), 6000);
    window.addEventListener("offline", () => setOffline(true));
    window.addEventListener("online", () => setOffline(false));
    return () => clearTimeout(timeout);
  }, []);

  const saveTeam = useCallback(async (next) => {
    setTeam(next);
    const ok = await cloudSet("team", JSON.stringify(next));
    if (!ok) setError("Sauvegarde de l'équipe impossible. Vérifie ta connexion.");
  }, []);
  const saveProperties = useCallback(async (next) => {
    setProperties(next);
    const ok = await cloudSet("properties", JSON.stringify(next));
    if (!ok) setError("Sauvegarde des logements impossible. Vérifie ta connexion.");
  }, []);
  const saveCleanings = useCallback(async (next) => {
    setCleanings(next);
    const ok = await cloudSet("cleanings", JSON.stringify(next));
    if (!ok) setError("Sauvegarde du planning impossible. Vérifie ta connexion.");
  }, []);
  const saveReservations = useCallback(async (next) => {
    setReservations(next);
    const ok = await cloudSet("reservations", JSON.stringify(next));
    if (!ok) setError("Sauvegarde des réservations impossible. Vérifie ta connexion.");
  }, []);

  const completeOnboarding = async (name, role) => {
    const id = uid();
    const p = { id, name, role };
    setProfile(p);
    localSet("profile", JSON.stringify(p));
    await saveTeam([...team, { id, name, role }]);
  };
  const switchProfile = () => { localSet("profile", ""); setProfile(null); };

  if (loading) {
    return (
      <div style={{ background: C.linen }} className="min-h-screen flex items-center justify-center">
        <div className="animate-spin"><Icon name="loader" size={28} color={C.terracotta} /></div>
      </div>
    );
  }

  if (error && !profile) {
    return (
      <div style={{ background: C.ink }} className="min-h-screen flex items-center justify-center px-6 text-center">
        <div>
          <Icon name="alert" size={28} color={C.terracotta} />
          <p style={{ color: C.linen }} className="mt-3 text-sm">{error}</p>
        </div>
      </div>
    );
  }

  if (!profile) return <Onboarding onDone={completeOnboarding} />;

  return (
    <div style={{ background: C.linen, fontFamily: "'Inter', sans-serif" }} className="min-h-screen flex flex-col md:flex-row">
      <TabBar tab={tab} setTab={setTab} role={profile.role} />
      <div className="flex-1 flex flex-col min-w-0 md:pl-56">
        <Header profile={profile} onSwitch={switchProfile} offline={offline} onOpenGCal={() => setShowGCal(true)} />
        {error && (
          <div className="mx-4 md:mx-8 mt-3 rounded-lg px-3 py-2 text-sm flex items-center gap-2" style={{ background: "#F3DCCF", color: C.terracotta }}>
            <Icon name="alert" size={16} /><span className="flex-1">{error}</span>
            <button onClick={() => setError("")}><Icon name="x" size={14} /></button>
          </div>

          <div className="md:max-w-3xl md:mx-auto">

      </div>
      {showGCal && (
        <GoogleAgendaPanel profile={profile} cleanings={cleanings} properties={properties} onClose={() => setShowGCal(false)} />
      )}
    </div>
  );
}

function GoogleAgendaPanel({ profile, cleanings, properties, onClose }) {
  const [connected, setConnected] = useState(gcalIsConnected(profile.id));
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const myCount = cleanings.filter((c) => c.assignedToId === profile.id).length;

  const doConnect = async () => {
    setBusy(true); setMsg("");
    try {
      await gcalConnect(profile.id);
      setConnected(true);
      const res = await syncMyCleanings(profile, cleanings, properties);
      setMsg(`Connecté ! ${res.created} événement${res.created > 1 ? "s" : ""} créé${res.created > 1 ? "s" : ""}.`);
    } catch (e) {
      if (e?.message === "not-configured") setMsg("La connexion Google Agenda n'est pas encore configurée pour cette appli — voir README.md.");
      else setMsg("La connexion a échoué ou a été annulée. Réessaie.");
    }
    setBusy(false);
  };
  const doSync = async () => {
    setBusy(true); setMsg("");
    try {
      const res = await syncMyCleanings(profile, cleanings, properties);
      setMsg(`Synchronisé : ${res.created} créé${res.created > 1 ? "s" : ""}, ${res.updated} mis à jour, ${res.removed} retiré${res.removed > 1 ? "s" : ""}.`);
    } catch (e) {
      setMsg("La synchronisation a échoué. Réessaie, ou reconnecte ton agenda si le problème persiste.");
    }
    setBusy(false);
  };
  const doDisconnect = () => {
    gcalDisconnect(profile.id);
    setConnected(false);
    setMsg("Déconnecté de cette appli. Tes événements déjà créés restent dans ton agenda.");
  };

  return (
    <Sheet onClose={onClose} title="Google Agenda">
      <p style={{ color: C.taupe }} className="text-sm mb-4">
        Connecte ton agenda Google personnel : tes {myCount} ménage{myCount !== 1 ? "s" : ""} assigné{myCount !== 1 ? "s" : ""} (passés et à venir) y apparaîtront automatiquement.
      </p>

      {!connected ? (
        <button onClick={doConnect} disabled={busy} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 disabled:opacity-50" style={{ background: C.ink, color: C.linen }}>
          {busy ? <div className="animate-spin"><Icon name="loader" size={16} /></div> : <Icon name="calendar" size={16} />}
          Connecter Google Agenda
        </button>
      ) : (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: "#DDE7DF" }}>
            <Icon name="check" size={14} color={C.sauge} />
            <span style={{ color: C.sauge }} className="text-sm font-medium">Agenda connecté</span>
          </div>
          <button onClick={doSync} disabled={busy} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 disabled:opacity-50" style={{ background: C.ink, color: C.linen }}>
            {busy ? <div className="animate-spin"><Icon name="loader" size={16} /></div> : <Icon name="calendar" size={16} />}
            Synchroniser maintenant
          </button>
          <button onClick={doDisconnect} disabled={busy} className="w-full py-2.5 rounded-xl text-sm font-medium disabled:opacity-50" style={{ background: C.linenSoft, color: C.taupe }}>
            Déconnecter
          </button>
        </div>
      )}
      {msg && <p style={{ color: C.taupe }} className="text-xs mt-3">{msg}</p>}
      <p style={{ color: C.taupe }} className="text-xs mt-4">La synchronisation se fait à la demande (bouton ci-dessus), pas en continu en arrière-plan — pense à resynchroniser après des changements importants.</p>
    </Sheet>
  );
}
function PlanningTab({ profile, team, properties, cleanings, saveCleanings, saveProperties }) {
  const [filter, setFilter] = useState("upcoming");
  const [showForm, setShowForm] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [view, setView] = useState("liste");
  const [sortDesc, setSortDesc] = useState(false);

  const visible = useMemo(() => {
    let list = cleanings;
    if (profile.role === "cleaner") list = list.filter((c) => c.assignedToId === profile.id);
    const today = todayISO();
    if (filter === "today") list = list.filter((c) => c.date === today && c.status !== "termine");
    else if (filter === "upcoming") list = list.filter((c) => c.date >= today && c.status !== "termine");
    else if (filter === "history") list = list.filter((c) => c.date < today || c.status === "termine");
    return [...list].sort((a, b) => sortDesc ? (b.date + b.time).localeCompare(a.date + a.time) : (a.date + a.time).localeCompare(b.date + b.time));
  }, [cleanings, profile, filter, sortDesc]);

  const todayPending = cleanings.filter((c) => c.date === todayISO() && c.status !== "termine" && (profile.role === "owner" || c.assignedToId === profile.id));
  const propertyOf = (id) => properties.find((p) => p.id === id);
  const personOf = (id) => team.find((t) => t.id === id);
  const openCleaning = openId ? cleanings.find((c) => c.id === openId) : null;

  // Le statut se met à jour simplement ; le linge sale se gère désormais
  // uniquement via le bouton manuel "Ajouter linge sale" dans la fiche.
  const updateCleaning = async (patch) => {
    await saveCleanings(cleanings.map((c) => (c.id === openCleaning.id ? { ...c, ...patch } : c)));
  };

  return (
    <div>
      {todayPending.length > 0 && (
        <div className="rounded-xl px-4 py-3 mb-4 flex items-center gap-3" style={{ background: "#F3DCCF" }}>
          <Icon name="alert" size={18} color={C.terracotta} />
          <p style={{ color: C.terracotta }} className="text-sm font-medium">{todayPending.length} ménage{todayPending.length > 1 ? "s" : ""} à faire aujourd'hui</p>
        </div>
      )}
      <div className="flex items-center justify-between mb-4">
        <div className="flex gap-2">
          {[["upcoming", "À venir"], ["today", "Aujourd'hui"], ["history", "Historique"]].map(([id, label]) => (
            <button key={id} onClick={() => setFilter(id)} className="text-xs font-medium px-3 py-1.5 rounded-full"
              style={{ background: filter === id ? C.ink : C.linenSoft, color: filter === id ? C.linen : C.taupe }}>{label}</button>
          ))}
        </div>
        <div className="flex items-center gap-2">
          <button onClick={() => setView(view === "liste" ? "gantt" : "liste")} title="Vue planning" className="rounded-full p-2" style={{ background: view === "gantt" ? C.ink : C.linenSoft }}>
            <Icon name="barChart" size={18} color={view === "gantt" ? C.linen : C.taupe} />
          </button>
          {profile.role === "owner" && (
            <button onClick={() => setShowForm(true)} className="rounded-full p-2" style={{ background: C.ink }}>
              <Icon name="plus" size={18} color={C.linen} />
            </button>
          )}
        </div>
      </div>
      {view === "gantt" && (
        <MenageGanttChart profile={profile} team={team} properties={properties} cleanings={cleanings} onOpen={setOpenId} />
      )}
      {view === "liste" && (
        <>
          <div className="flex items-center justify-between mb-3">
            <p style={{ color: C.taupe }} className="text-xs">{visible.length} mission{visible.length !== 1 ? "s" : ""}</p>
            <button onClick={() => setSortDesc((v) => !v)} className="flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full" style={{ background: C.linenSoft, color: C.ink }}>
              <Icon name={sortDesc ? "chevronDown" : "chevronUp"} size={13} color={C.taupe} />
              {sortDesc ? "Plus récent d'abord" : "Plus ancien d'abord"}
            </button>
          </div>
          {visible.length === 0 && (
            <EmptyState icon="calendar" text={profile.role === "owner" ? "Aucun ménage ici. Ajoute-en un avec le bouton +." : "Aucun ménage ne t'est assigné pour l'instant."} />
          )}
          <div className="flex flex-col gap-3">
            {visible.map((c) => (
              <DoorTagCard key={c.id} cleaning={c} property={propertyOf(c.propertyId)} person={personOf(c.assignedToId)} onClick={() => setOpenId(c.id)} />
            ))}
          </div>
        </>
      )}
      {showForm && (
        <NewCleaningForm properties={properties} team={team} onClose={() => setShowForm(false)}
          onCreate={async (data) => { await saveCleanings([...cleanings, { id: uid(), status: "a_attribuer", checklistDone: {}, ...data }]); setShowForm(false); }} />
      )}
      {openCleaning && (
        <CleaningDetail cleaning={openCleaning} property={propertyOf(openCleaning.propertyId)} properties={properties} saveProperties={saveProperties} team={team} person={personOf(openCleaning.assignedToId)} profile={profile}
          onClose={() => setOpenId(null)}
          onUpdate={updateCleaning}
          onDelete={async () => { await saveCleanings(cleanings.filter((c) => c.id !== openCleaning.id)); setOpenId(null); }} />
      )}
    </div>
  );
}

function MenageGanttChart({ profile, team, properties, cleanings, onOpen }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const nDays = daysInMonth(year, month);
  const monthLabel = base.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const todayIdx = (now.getFullYear() === year && now.getMonth() === month) ? now.getDate() : null;
  const dayCols = Array.from({ length: nDays }, (_, i) => i + 1);
  const monthStartISO = isoOf(year, month, 1);
  const nextMonthStartISO = isoOf(year, month + 1, 1);
  const isDesktop = useIsDesktop();
  const dayW = isDesktop ? 42 : DAY_W;
  const labelW = isDesktop ? 150 : LABEL_W;
  const scrollRef = useHorizontalScroll();

  const visibleCleanings = profile.role === "cleaner" ? cleanings.filter((c) => c.assignedToId === profile.id) : cleanings;
  const personOf = (id) => team.find((t) => t.id === id);

  if (properties.length === 0) {
    return <EmptyState icon="home" text="Ajoute un logement pour voir apparaître le planning." />;
  }

  return (
    <div className="rounded-2xl overflow-hidden border mb-6" style={{ borderColor: C.taupeLight, background: "#FFFDF8" }}>
      <div className="flex items-center justify-between px-3 py-2.5">
        <button onClick={() => setMonthOffset((m) => m - 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronLeft" size={16} color={C.taupe} /></button>
        <p style={{ color: C.ink, fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold capitalize">{monthLabel}</p>
        <button onClick={() => setMonthOffset((m) => m + 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronRight" size={16} color={C.taupe} /></button>
      </div>
      <div className="overflow-x-auto" ref={scrollRef} style={{ cursor: "grab" }}>
        <div style={{ width: labelW + nDays * dayW }}>
          <div className="flex sticky top-0 z-10" style={{ background: "#FFFDF8" }}>
            <div style={{ width: labelW, borderColor: C.taupeLight }} className="shrink-0 border-b" />
            {dayCols.map((d) => {
              const weekend = isWeekend(year, month, d);
              const isToday = d === todayIdx;
              return (
                <div key={d} style={{ width: dayW, background: isToday ? "#F3DCCF" : weekend ? "#00000006" : "transparent" }} className="shrink-0 text-center pt-1 pb-1.5 border-b">
                  <div style={{ color: isToday ? C.terracotta : C.taupe, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[9px] font-semibold leading-none mb-0.5">{dayLetter(year, month, d)}</div>
                  <div style={{ color: isToday ? C.terracotta : C.taupe, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[10px] leading-none">{d}</div>
                </div>
              );
            })}
          </div>
          {properties.map((p) => {
            const cleaningsForP = visibleCleanings.filter((c) => c.propertyId === p.id && c.date >= monthStartISO && c.date < nextMonthStartISO);
            return (
              <div key={p.id} className="flex border-b" style={{ borderColor: C.taupeLight }}>
                <div style={{ width: labelW, position: "sticky", left: 0, background: "#FFFDF8" }} className="shrink-0 px-2.5 py-3 flex items-center z-10">
                  <span style={{ color: C.ink }} className="text-xs font-medium truncate">{p.name}</span>
                </div>
                <div style={{ width: nDays * dayW, position: "relative", minHeight: 44 }}>
                  {dayCols.filter((d) => isWeekend(year, month, d)).map((d) => (
                    <div key={d} style={{ position: "absolute", left: (d - 1) * dayW, top: 0, bottom: 0, width: dayW, background: "#00000006" }} />
                  ))}
                  {cleaningsForP.map((c) => {
                    const day = parseISO(c.date).getDate();
                    const s = STATUS[c.status] || STATUS.a_faire;
                    const person = personOf(c.assignedToId);
                    const personColor = person?.color ? GCAL_COLORS.find((g) => g.id === person.color)?.hex : null;
                    const isArrival = c.type === "arrivee";
                    return (
                      <button key={c.id} onClick={() => onOpen(c.id)} title={`${p.name} · ${isArrival ? "Arrivée client" : "Ménage"} · ${person?.name || "Non assigné"} · ${s.label}`}
                        className={`absolute top-2 flex items-center justify-center ${isArrival ? "rounded-full" : "rounded-md"}`}
                        style={{ left: (day - 1) * dayW + 3, width: dayW - 6, height: 26, background: s.color, border: personColor ? `2.5px solid ${personColor}` : "2.5px solid transparent" }}>
                        {isArrival ? <Icon name="key" size={12} color="#fff" /> : (
                          <span className="text-[10px] font-semibold" style={{ color: "#fff" }}>{(person?.name || "?").charAt(0).toUpperCase()}</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="flex gap-3 px-3 py-2.5 flex-wrap">
        {Object.entries(STATUS).map(([k, s]) => (
          <span key={k} className="flex items-center gap-1.5 text-[11px]" style={{ color: C.taupe }}>
            <span style={{ width: 8, height: 8, borderRadius: 4, background: s.color, display: "inline-block" }} />{s.label}
          </span>
        ))}
        <span className="flex items-center gap-1.5 text-[11px]" style={{ color: C.taupe }}>
          <span style={{ width: 8, height: 8, borderRadius: 4, background: C.taupe, display: "inline-block" }} />Carré = ménage
        </span>
        <span className="flex items-center gap-1.5 text-[11px]" style={{ color: C.taupe }}>
          <span style={{ width: 8, height: 8, borderRadius: 8, background: C.taupe, display: "inline-block" }} />Rond (🔑) = arrivée client
        </span>
      </div>
      {team.some((t) => t.color) && (
        <div className="flex gap-3 px-3 pb-2.5 flex-wrap border-t pt-2.5" style={{ borderColor: C.taupeLight }}>
          {team.filter((t) => t.color).map((t) => {
            const gc = GCAL_COLORS.find((g) => g.id === t.color);
            return (
              <span key={t.id} className="flex items-center gap-1.5 text-[11px]" style={{ color: C.taupe }}>
                <span style={{ width: 8, height: 8, borderRadius: 4, background: gc?.hex, display: "inline-block" }} />{t.name}
              </span>
            );
          })}
        </div>
      )}
    </div>
  );
}

function NewCleaningForm({ properties, team, onClose, onCreate, initial }) {
  const [propertyId, setPropertyId] = useState(initial?.propertyId || properties[0]?.id || "");

  const [date, setDate] = useState(initial?.date || todayISO());
  const [time, setTime] = useState(initial?.time || "11:00");
  const [assignedToId, setAssignedToId] = useState(initial?.assignedToId || team[0]?.id || "");
  const submit = () => {
    if (!propertyId) return;
    const data = { propertyId, type, date, time, assignedToId: assignedToId || null };
    if (initial) {
      // édition : si on vient d'assigner quelqu'un à une mission encore "à attribuer", elle passe automatiquement à "à faire"
      if (assignedToId && initial.status === "a_attribuer") data.status = "a_faire";

      data.status = assignedToId ? "a_faire" : "a_attribuer";

    <Sheet onClose={onClose} title={initial ? `Modifier ${type === "arrivee" ? "l'arrivée" : "le ménage"}` : "Nouvelle mission"}>
      {properties.length === 0 ? (
        <EmptyState icon="home" text="Ajoute d'abord un logement dans l'onglet Logements." />

        <div className="flex flex-col gap-4">
          {!initial && (
            <Field label="Type de mission">
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => setType("menage")} className="rounded-xl py-2.5 text-sm font-medium border transition"
                  style={{ background: type === "menage" ? C.ink : "transparent", color: type === "menage" ? "#fff" : C.taupe, borderColor: C.ink }}>
                  Ménage
                </button>
                <button onClick={() => setType("arrivee")} className="rounded-xl py-2.5 text-sm font-medium border transition flex items-center justify-center gap-1.5"
                  style={{ background: type === "arrivee" ? C.violet : "transparent", color: type === "arrivee" ? "#fff" : C.violet, borderColor: C.violet }}>
                  <Icon name="key" size={13} /> Arrivée client
                </button>
              </div>
            </Field>
          )}
          <Field label="Logement">
            <select value={propertyId} onChange={(e) => setPropertyId(e.target.value)} style={selectStyle}>
              {properties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Date"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={selectStyle} /></Field>
            <Field label="Heure"><input type="time" value={time} onChange={(e) => setTime(e.target.value)} style={selectStyle} /></Field>
          </div>
          <Field label="Assigné à">
            <select value={assignedToId} onChange={(e) => setAssignedToId(e.target.value)} style={selectStyle}>
              <option value="">Non assigné</option>
              {team.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </Field>
          <button onClick={submit} className="w-full py-3 rounded-xl font-medium mt-2" style={{ background: C.ink, color: C.linen }}>
            {initial ? "Enregistrer" : "Ajouter au planning"}
          </button>
        </div>
      )}
    </Sheet>
  );
}

function CleaningDetail({ cleaning, property, properties, saveProperties, team, person, profile, onClose, onUpdate, onDelete }) {
  const [photos, setPhotos] = useState([]);
  const [loadingPhotos, setLoadingPhotos] = useState(true);
  const [uploading, setUploading] = useState(false);
  const [addingKit, setAddingKit] = useState(false);
  const [dirtyQty, setDirtyQty] = useState(1);
  const [notes, setNotes] = useState(cleaning.notes || "");
  const [editing, setEditing] = useState(false);
  const [generatingReport, setGeneratingReport] = useState(false);
  const [sharing, setSharing] = useState(false);
  const [shareMsg, setShareMsg] = useState("");

  useEffect(() => {
    (async () => {
      const raw = await cloudGet(`photos:${cleaning.id}`);
      setPhotos(raw ? JSON.parse(raw) : []);
      setLoadingPhotos(false);
    })();
  }, [cleaning.id]);

  const checklist = property?.checklist || [];
  const doneMap = cleaning.checklistDone || {};
  const doneCount = checklist.filter((it) => doneMap[it.id]).length;
  const toggleItem = (itemId) => onUpdate({ checklistDone: { ...doneMap, [itemId]: !doneMap[itemId] } });
  const setStatus = (status) => onUpdate({ status });
  const isArrival = cleaning.type === "arrivee";

  if (editing) {
    return (
      <NewCleaningForm properties={properties} team={team} initial={cleaning} onClose={() => setEditing(false)}
        onCreate={async (data) => { await onUpdate(data); setEditing(false); }} />
    );
  }

  const handlePhoto = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setUploading(true);
    try {
      const dataUrl = await compressImage(file);
      const next = [...photos, dataUrl];
      setPhotos(next);
      await cloudSet(`photos:${cleaning.id}`, JSON.stringify(next));
    } catch (err) {}
    setUploading(false);
    e.target.value = "";
  };
  const removePhoto = async (idx) => {
    const next = photos.filter((_, i) => i !== idx);
    setPhotos(next);
    await cloudSet(`photos:${cleaning.id}`, JSON.stringify(next));
  };
  const saveNotes = () => onUpdate({ notes });

  return (
    <Sheet onClose={onClose} title={`${isArrival ? "Arrivée client" : "Ménage"}${property?.name ? " — " + property.name : ""}`}>
      <div style={{ color: C.taupe }} className="flex items-center gap-3 text-sm mb-4">
        <span className="flex items-center gap-1"><Icon name="calendar" size={14} />{fmtDate(cleaning.date)}</span>
        <span className="flex items-center gap-1"><Icon name="clock" size={14} />{cleaning.time}</span>
      </div>
      {property?.address && <p style={{ color: C.taupe }} className="flex items-center gap-1 text-sm mb-4"><Icon name="mapPin" size={14} /> {property.address}</p>}
      {isArrival && property?.keyHandoverPrice != null && (
        <p style={{ color: C.taupe }} className="flex items-center gap-1 text-sm mb-4"><Icon name="key" size={14} /> Prix de cette mission : {property.keyHandoverPrice} €</p>
      )}
      <div className="flex gap-2 mb-5">

          <div className="flex flex-wrap gap-2 mb-2">

          {photos.length > 0 && (

              <button

                  if (res.ok) setShareMsg("");

                  else if (res.reason === "error") setShareMsg("Le partage a échoué. Réessaie.");

                className="w-full py-2.5 rounded-xl text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-50 mb-2" style={{ background: C.linenSoft, color: C.ink }}>

      <textarea value={notes} onChange={(e) => setNotes(e.target.value)} onBlur={saveNotes} placeholder="Ex. clé sous le pot, interphone en panne…" rows={3}
        className="w-full px-3 py-2 rounded-xl text-sm outline-none mb-5" style={{ background: C.linenSoft, color: C.ink }} />

      <button
        onClick={async () => { setGeneratingReport(true); try { await generateCleaningReport(cleaning, property, person, photos); } catch (e) {} setGeneratingReport(false); }}

        className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm mb-2 disabled:opacity-50" style={{ background: C.ink, color: C.linen }}>
        {generatingReport ? <div className="animate-spin"><Icon name="loader" size={15} /></div> : <Icon name="download" size={15} />}
        Générer le rapport de passage (Word)
      </button>
      <p style={{ color: C.taupe }} className="text-xs mb-5">Inclut les informations d'entreprise de {person?.name || "la personne assignée"}, le logement, la checklist et les photos prises.</p>

      {profile.role === "owner" && (
        <div className="flex flex-col gap-2">
          <button onClick={() => setEditing(true)} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm" style={{ background: C.linenSoft, color: C.ink }}>

          <button onClick={onDelete} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm" style={{ background: "#F3DCCF", color: C.terracotta }}>

        </div>
      )}
    </Sheet>
  );
}

/* =========================================================
   OCCUPATION TAB — Gantt des réservations + taux de remplissage
========================================================= */
const DAY_W = 30;
const LABEL_W = 108;

// Écran large (PC) : colonnes de jours un peu plus grandes pour la lisibilité.
function useIsDesktop() {
  const [isDesktop, setIsDesktop] = useState(() => window.matchMedia("(min-width: 768px)").matches);
  useEffect(() => {
    const mq = window.matchMedia("(min-width: 768px)");
    const handler = () => setIsDesktop(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler));
  }, []);
  return isDesktop;
}
// Permet de faire défiler horizontalement à la molette de souris et de
// glisser avec le clic maintenu — sur PC, il n'y a pas de doigt pour swiper,
// et la molette seule ne défile que verticalement par défaut.
function useHorizontalScroll() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onWheel = (e) => {
      if (el.scrollWidth <= el.clientWidth) return;
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        e.preventDefault();
        el.scrollLeft += e.deltaY;
      }
    };
    let dragging = false, startX = 0, startScroll = 0;
    const onDown = (e) => { dragging = true; startX = e.pageX; startScroll = el.scrollLeft; el.style.cursor = "grabbing"; };
    const onUp = () => { dragging = false; el.style.cursor = "grab"; };
    const onMove = (e) => { if (!dragging) return; el.scrollLeft = startScroll - (e.pageX - startX); };
    el.addEventListener("wheel", onWheel, { passive: false });
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mouseup", onUp);
    window.addEventListener("mousemove", onMove);
    return () => {
      el.removeEventListener("wheel", onWheel);
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mouseup", onUp);
      window.removeEventListener("mousemove", onMove);
    };
  }, []);
  return ref;
}

function OccupationTab({ profile, properties, reservations, saveReservations, cleanings, saveCleanings }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [showForm, setShowForm] = useState(false);
  const [openId, setOpenId] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [genMsg, setGenMsg] = useState("");
  const isDesktop = useIsDesktop();
  const dayW = isDesktop ? 42 : DAY_W;
  const labelW = isDesktop ? 150 : LABEL_W;
  const scrollRef = useHorizontalScroll();
  const cardsScrollRef = useHorizontalScroll();

  const runGenerateMissing = async () => {
    setGenerating(true);
    setGenMsg("");
    const added = await generateMissingCleanings(reservations, properties, cleanings, saveCleanings);
    setGenerating(false);
    setGenMsg(added > 0 ? `${added} mission${added > 1 ? "s" : ""} créée${added > 1 ? "s" : ""}.` : "Tout est déjà à jour.");
  };

  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const nDays = daysInMonth(year, month);
  const monthLabel = base.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const monthStartISO = isoOf(year, month, 1);
  const monthEndISO = isoOf(year, month, nDays); // last day, inclusive date
  const todayIdx = (now.getFullYear() === year && now.getMonth() === month) ? now.getDate() : null;

  const dayCols = Array.from({ length: nDays }, (_, i) => i + 1);

  // nights overlap helper (checkOut exclusive)
  const nextMonthStartISO = isoOf(year, month + 1, 1);
  const nightsInMonth = (res) => {
    const ci = res.checkIn, co = res.checkOut;
    if (co <= monthStartISO || ci >= nextMonthStartISO) return 0;
    const start = ci < monthStartISO ? monthStartISO : ci;
    const end = co > nextMonthStartISO ? nextMonthStartISO : co;
    return Math.max(0, Math.round((parseISO(end) - parseISO(start)) / 86400000));
  };

  const occupancy = useMemo(() => {
    return properties.map((p) => {
      const nights = reservations.filter((r) => r.propertyId === p.id).reduce((sum, r) => sum + nightsInMonth(r), 0);
      const pct = Math.round((Math.min(nights, nDays) / nDays) * 100);
      return { property: p, nights, pct };
    });
  }, [properties, reservations, year, month]);

  const avgPct = occupancy.length ? Math.round(occupancy.reduce((s, o) => s + o.pct, 0) / occupancy.length) : 0;

  const pctColor = (pct) => (pct < 40 ? C.terracotta : pct < 70 ? C.or : C.sauge);

  const dayIndexClamped = (iso) => {
    const idx = Math.round((parseISO(iso) - new Date(year, month, 1)) / 86400000) + 1;
    return Math.max(1, Math.min(nDays + 1, idx));
  };

  const openReservation = openId ? reservations.find((r) => r.id === openId) : null;

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", color: C.ink }} className="text-lg font-semibold">Réservations</h2>
        {profile.role === "owner" && (
          <button onClick={() => setShowForm(true)} className="rounded-full p-2" style={{ background: C.ink }}>
            <Icon name="plus" size={18} color={C.linen} />
          </button>
        )}
      </div>

      {profile.role === "owner" && (
        <div className="mb-4">
          <button onClick={runGenerateMissing} disabled={generating}
            className="text-xs font-medium px-3 py-2 rounded-xl flex items-center gap-2 disabled:opacity-60" style={{ background: C.linenSoft, color: C.ink }}>
            {generating ? <div className="animate-spin"><Icon name="loader" size={14} color={C.taupe} /></div> : <Icon name="calendar" size={14} color={C.taupe} />}
            Générer les ménages manquants
          </button>
          {genMsg && <p style={{ color: C.sauge }} className="text-xs mt-1.5">{genMsg}</p>}
        </div>
      )}

      {/* Résumé taux de remplissage */}
      {properties.length > 0 && (
        <div className="mb-4">
          <div className="flex items-center justify-between mb-2">
            <p style={{ color: C.ink }} className="text-sm font-semibold">Taux de remplissage — {monthLabel}</p>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: pctColor(avgPct) }} className="text-sm font-semibold">{avgPct}% moy.</span>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-1" ref={cardsScrollRef} style={{ cursor: "grab" }}>
            {occupancy.map(({ property, pct, nights }) => (
              <div key={property.id} className="shrink-0 rounded-xl px-3 py-2 min-w-[110px]" style={{ background: "#FFFDF8", border: `1px solid ${C.taupeLight}` }}>
                <p style={{ color: C.ink }} className="text-xs font-medium truncate">{property.name}</p>
                <div className="flex items-center gap-1.5 mt-1">
                  <div className="flex-1 h-1.5 rounded-full" style={{ background: C.linenSoft }}>
                    <div className="h-1.5 rounded-full" style={{ width: `${pct}%`, background: pctColor(pct) }} />
                  </div>
                  <span style={{ color: pctColor(pct), fontFamily: "'IBM Plex Mono', monospace" }} className="text-[11px] font-semibold">{pct}%</span>
                </div>
                <p style={{ color: C.taupe }} className="text-[10px] mt-1">{nights} nuits réservées</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Nav mois */}
      <div className="flex items-center justify-between mb-3">
        <button onClick={() => setMonthOffset((m) => m - 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronLeft" size={16} color={C.taupe} /></button>
        <p style={{ color: C.ink, fontFamily: "'Space Grotesk', sans-serif" }} className="text-sm font-semibold capitalize">{monthLabel}</p>
        <button onClick={() => setMonthOffset((m) => m + 1)} className="rounded-full p-1.5" style={{ background: C.linenSoft }}><Icon name="chevronRight" size={16} color={C.taupe} /></button>
      </div>

      {properties.length === 0 ? (
        <EmptyState icon="home" text="Ajoute un logement pour voir son planning de réservations." />
      ) : (
        <div className="rounded-2xl overflow-hidden border mb-6" style={{ borderColor: C.taupeLight, background: "#FFFDF8" }}>
          <div className="overflow-x-auto" ref={scrollRef} style={{ cursor: "grab" }}>
            <div style={{ width: labelW + nDays * dayW }}>
              {/* header jours */}
              <div className="flex sticky top-0 z-10" style={{ background: "#FFFDF8" }}>
                <div style={{ width: labelW, borderColor: C.taupeLight }} className="shrink-0 border-b" />
                {dayCols.map((d) => {
                  const weekend = isWeekend(year, month, d);
                  const isToday = d === todayIdx;
                  return (
                    <div key={d} style={{ width: dayW, background: isToday ? "#F3DCCF" : weekend ? "#00000006" : "transparent" }}
                      className="shrink-0 text-center pt-1 pb-1.5 border-b" >
                      <div style={{ color: isToday ? C.terracotta : C.taupe, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[9px] font-semibold leading-none mb-0.5">
                        {dayLetter(year, month, d)}
                      </div>
                      <div style={{ color: isToday ? C.terracotta : C.taupe, fontFamily: "'IBM Plex Mono', monospace" }} className="text-[10px] leading-none">
                        {d}
                      </div>
                    </div>
                  );
                })}
              </div>
              {/* lignes logements */}
              {properties.map((p) => {
                const resForP = reservations.filter((r) => r.propertyId === p.id && r.checkOut > monthStartISO && r.checkIn <= monthEndISO);
                // Jours de rotation : un client part ET un autre arrive le même
                // jour sur ce logement — cas à repérer en priorité pour
                // organiser le ménage (délai très serré entre les deux).
                const checkoutDays = new Set(resForP.map((r) => r.checkOut));
                const turnoverDays = resForP.map((r) => r.checkIn).filter((d) => checkoutDays.has(d) && d >= monthStartISO && d <= monthEndISO);
                return (
                  <div key={p.id} className="flex border-b" style={{ borderColor: C.taupeLight }}>
                    <div style={{ width: labelW, position: "sticky", left: 0, background: "#FFFDF8" }} className="shrink-0 px-2.5 py-3 flex items-center z-10">
                      <span style={{ color: C.ink }} className="text-xs font-medium truncate">{p.name}</span>
                    </div>
                    <div style={{ width: nDays * dayW, position: "relative", minHeight: 44 }}>
                      {dayCols.filter((d) => isWeekend(year, month, d)).map((d) => (
                        <div key={d} style={{ position: "absolute", left: (d - 1) * dayW, top: 0, bottom: 0, width: dayW, background: "#00000006" }} />
                      ))}
                      {turnoverDays.map((d) => {
                        const day = parseISO(d).getDate();
                        return (
                          <div key={"turnover-" + d} title="Départ et arrivée le même jour — ménage à organiser entre les deux"
                            className="absolute top-0 bottom-0 pointer-events-none" style={{ left: (day - 1) * dayW, width: dayW, zIndex: 5 }}>
                            <div className="w-full h-full" style={{ background: `repeating-linear-gradient(45deg, ${C.terracotta}33, ${C.terracotta}33 4px, transparent 4px, transparent 8px)`, borderLeft: `2px dashed ${C.terracotta}`, borderRight: `2px dashed ${C.terracotta}` }} />
                            <div className="absolute -top-1.5 left-1/2 -translate-x-1/2 rounded-full flex items-center justify-center" style={{ width: 14, height: 14, background: C.terracotta }}>
                              <Icon name="alert" size={9} color="#fff" />
                            </div>
                          </div>
                        );
                      })}
                      {resForP.map((r) => {
                        const startCol = dayIndexClamped(r.checkIn < monthStartISO ? monthStartISO : r.checkIn);
                        const endCol = dayIndexClamped(r.checkOut > isoOf(year, month + 1, 1) ? isoOf(year, month + 1, 1) : r.checkOut);
                        const src = SOURCES[r.source] || SOURCES.autre;
                        // Le jour de départ n'est pas une nuit réservée, mais on le
                        // colore quand même (teinte plus claire) pour signaler que
                        // le client part ce jour-là — utile pour repérer les jours
                        // de rotation entre deux séjours.
                        const departureVisible = r.checkOut <= monthEndISO && r.checkOut >= monthStartISO;
                        return (
                          <React.Fragment key={r.id}>
                            <button onClick={() => setOpenId(r.id)}
                              className="absolute top-2 rounded-md text-left px-1.5 flex items-center overflow-hidden"
                              style={{ left: (startCol - 1) * dayW + 2, width: Math.max(dayW - 4, (endCol - startCol) * dayW - 4), height: 26, background: src.color }}>
                              <span className="text-[10px] font-medium truncate" style={{ color: "#fff" }}>{r.guestName}</span>
                            </button>
                            {departureVisible && (
                              <div onClick={() => setOpenId(r.id)} title="Jour de départ"
                                className="absolute top-2 rounded-md cursor-pointer"
                                style={{ left: (endCol - 1) * dayW + 2, width: dayW - 4, height: 26, background: src.color, opacity: 0.35 }} />
                            )}
                          </React.Fragment>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="flex gap-3 px-3 py-2.5 flex-wrap">
            {Object.entries(SOURCES).map(([k, s]) => (
              <span key={k} className="flex items-center gap-1.5 text-[11px]" style={{ color: C.taupe }}>
                <span style={{ width: 8, height: 8, borderRadius: 4, background: s.color, display: "inline-block" }} />{s.label}
              </span>
            ))}
            <span className="flex items-center gap-1.5 text-[11px]" style={{ color: C.terracotta }}>
              <Icon name="alert" size={11} color={C.terracotta} />Rotation même jour
            </span>
          </div>
        </div>
      )}

      {showForm && (
        <ReservationForm properties={properties} onClose={() => setShowForm(false)}
          onCreate={async (data) => {
            const duplicate = reservations.some((r) => r.propertyId === data.propertyId && r.guestName === data.guestName && r.checkIn === data.checkIn && r.checkOut === data.checkOut);
            if (duplicate) { setShowForm(false); return; }
            const newRes = { id: uid(), ...data };
            await saveReservations([...reservations, newRes]);
            await syncReservationMissions(newRes, properties.find((p) => p.id === newRes.propertyId), cleanings, saveCleanings);
            setShowForm(false);
          }} />
      )}
      {openReservation && (
        <ReservationDetail reservation={openReservation} property={properties.find((p) => p.id === openReservation.propertyId)} profile={profile}
          onClose={() => setOpenId(null)}
          onUpdate={async (patch) => {
            const updated = { ...openReservation, ...patch };
            await saveReservations(reservations.map((r) => (r.id === openReservation.id ? updated : r)));
            await syncReservationMissions(updated, properties.find((p) => p.id === updated.propertyId), cleanings, saveCleanings);
          }}
          onDelete={async () => {
            await handleReservationDeleted(openReservation, cleanings, saveCleanings);
            await saveReservations(reservations.filter((r) => r.id !== openReservation.id));
            setOpenId(null);
          }} />
      )}
    </div>
  );
}

function ReservationForm({ properties, onClose, onCreate, initial }) {
  const [propertyId, setPropertyId] = useState(initial?.propertyId || properties[0]?.id || "");
  const [guestName, setGuestName] = useState(initial?.guestName || "");
  const [checkIn, setCheckIn] = useState(initial?.checkIn || todayISO());
  const [checkOut, setCheckOut] = useState(initial?.checkOut || todayISO());
  const [source, setSource] = useState(initial?.source || "airbnb");
  const [cleaningPrice, setCleaningPrice] = useState(initial?.cleaningPrice != null ? String(initial.cleaningPrice) : "");
  const [guestPhone, setGuestPhone] = useState(initial?.guestPhone || "");
  const [submitting, setSubmitting] = useState(false);
  const selectedProperty = properties.find((p) => p.id === propertyId);
  const normalPrice = selectedProperty?.defaultCleaningPrice;

  const submit = async () => {
    if (!propertyId || !guestName.trim() || checkOut <= checkIn || submitting) return;
    setSubmitting(true);
    await onCreate({ propertyId, guestName: guestName.trim(), checkIn, checkOut, source, cleaningPrice: cleaningPrice.trim() === "" ? null : Number(cleaningPrice), guestPhone: guestPhone.trim() });
    // pas de setSubmitting(false) ici : la fiche se ferme juste après (onCreate
    // déclenche la fermeture côté parent) — remettre à false provoquerait un
    // réaffichage du bouton actif pendant l'instant de la fermeture.
  };

  return (
    <Sheet onClose={onClose} title={initial ? "Modifier la réservation" : "Nouvelle réservation"}>
      {properties.length === 0 ? (
        <EmptyState icon="home" text="Ajoute d'abord un logement dans l'onglet Logements." />
      ) : (
        <div className="flex flex-col gap-4">
          <Field label="Logement">
            <select value={propertyId} onChange={(e) => setPropertyId(e.target.value)} style={selectStyle}>
              {properties.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </Field>
          <Field label="Nom du client">
            <input value={guestName} onChange={(e) => setGuestName(e.target.value)} placeholder="Ex. Famille Dupont" style={selectStyle} />
          </Field>
          <Field label="Téléphone (optionnel)">
            <input type="tel" value={guestPhone} onChange={(e) => setGuestPhone(e.target.value)} placeholder="Ex. 06 12 34 56 78" style={selectStyle} />
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Arrivée"><input type="date" value={checkIn} onChange={(e) => setCheckIn(e.target.value)} style={selectStyle} /></Field>
            <Field label="Départ"><input type="date" value={checkOut} onChange={(e) => setCheckOut(e.target.value)} style={selectStyle} /></Field>
          </div>
          {checkOut <= checkIn && <p className="text-xs" style={{ color: C.terracotta }}>La date de départ doit être après l'arrivée.</p>}
          <Field label="Plateforme">
            <div className="grid grid-cols-4 gap-2">
              {Object.entries(SOURCES).map(([k, s]) => (
                <button key={k} onClick={() => setSource(k)} className="py-2 rounded-lg text-[11px] font-semibold border"
                  style={{ background: source === k ? s.color : "transparent", color: source === k ? "#fff" : s.color, borderColor: s.color }}>{s.label}</button>
              ))}
            </div>
          </Field>
          <Field label={`Prix du ménage${normalPrice != null ? ` (normal : ${normalPrice} €)` : " (optionnel, pour les statistiques)"}`}>
            <input type="number" min="0" step="1" value={cleaningPrice} onChange={(e) => setCleaningPrice(e.target.value)}
              placeholder={normalPrice != null ? `Laisser vide = ${normalPrice} €` : "Ex. 60"} style={selectStyle} />
          </Field>
          {cleaningPrice.trim() !== "" && normalPrice != null && Number(cleaningPrice) !== normalPrice && (
            <p className="text-xs -mt-2" style={{ color: C.or }}>Prix exceptionnel : ce montant sera utilisé à la place du prix normal ({normalPrice} €) pour cette réservation.</p>
          )}
          <button onClick={submit} disabled={!guestName.trim() || checkOut <= checkIn || submitting} className="w-full py-3 rounded-xl font-medium mt-2 disabled:opacity-50 flex items-center justify-center gap-2" style={{ background: C.ink, color: C.linen }}>
            {submitting && <div className="animate-spin"><Icon name="loader" size={16} /></div>}
            {initial ? "Enregistrer" : "Ajouter la réservation"}
          </button>
        </div>
      )}
    </Sheet>
  );
}

function ReservationDetail({ reservation, property, profile, onClose, onUpdate, onDelete }) {
  const [editing, setEditing] = useState(false);
  const nights = Math.round((parseISO(reservation.checkOut) - parseISO(reservation.checkIn)) / 86400000);
  const src = SOURCES[reservation.source] || SOURCES.autre;
  const normalPrice = property?.defaultCleaningPrice;
  const effectivePrice = reservation.cleaningPrice != null ? reservation.cleaningPrice : normalPrice;
  const isException = reservation.cleaningPrice != null && normalPrice != null && reservation.cleaningPrice !== normalPrice;

  if (editing) {
    return (
      <ReservationForm properties={property ? [property] : []} initial={reservation} onClose={() => setEditing(false)}
        onCreate={async (data) => { await onUpdate(data); setEditing(false); }} />
    );
  }

  return (
    <Sheet onClose={onClose} title={reservation.guestName}>
      <div className="flex items-center gap-2 mb-4">
        <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full text-white" style={{ background: src.color }}>{src.label}</span>
        <span style={{ color: C.taupe }} className="text-xs">{property?.name}</span>
      </div>
      <div style={{ color: C.ink }} className="flex items-center justify-between text-sm mb-1">
        <span className="flex items-center gap-1.5"><Icon name="calendar" size={14} color={C.taupe} />Arrivée</span>
        <span>{fmtDate(reservation.checkIn)}</span>
      </div>
      <div style={{ color: C.ink }} className="flex items-center justify-between text-sm mb-4">
        <span className="flex items-center gap-1.5"><Icon name="calendar" size={14} color={C.taupe} />Départ</span>
        <span>{fmtDate(reservation.checkOut)}</span>
      </div>
      {reservation.guestPhone && (
        <a href={`tel:${reservation.guestPhone}`} className="flex items-center justify-between text-sm mb-4 rounded-xl px-3 py-2.5" style={{ background: C.linenSoft }}>
          <span className="flex items-center gap-1.5" style={{ color: C.ink }}><Icon name="phone" size={14} color={C.taupe} />{reservation.guestPhone}</span>
          <span style={{ color: C.sauge }} className="text-xs font-semibold">Appeler</span>
        </a>
      )}
      <p style={{ color: C.taupe }} className="text-xs mb-5">
        {nights} nuit{nights > 1 ? "s" : ""}{effectivePrice != null ? ` · ménage : ${effectivePrice} €${isException ? " (exceptionnel)" : ""}` : ""}
      </p>

      {profile.role === "owner" && (
        <div className="flex flex-col gap-2">
          <button onClick={() => setEditing(true)} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm" style={{ background: C.linenSoft, color: C.ink }}>
            <Icon name="pencil" size={15} /> Modifier
          </button>
          <button onClick={onDelete} className="w-full py-3 rounded-xl font-medium flex items-center justify-center gap-2 text-sm" style={{ background: "#F3DCCF", color: C.terracotta }}>
            <Icon name="trash" size={15} /> Supprimer
          </button>
        </div>
      )}
    </Sheet>
  );
}

   PROPRIÉTÉS TAB

  const [openId, setOpenId] = useState(null);
  const openProperty = openId ? properties.find((p) => p.id === openId) : null;

  return (
    <div>
